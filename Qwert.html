function saveWorkerReceivable(name, totalDue) {
  const amt = num('wrAmt');
  const method = getStr('wrMethod', 'cash');
  if (amt <= 0) return toast('أدخل مبلغ', 'error');
  if (amt > totalDue + 0.01) return toast('المبلغ أكبر من المستحقات', 'error');
  if (amt > getCashBalanceByMethod(method) + 0.01) return toast('رصيد الخزنة غير كافي', 'error');

  const summary = `<div>العامل: <strong>${esc(name)}</strong></div><div>المبلغ: <strong>${fmt(amt)} ج</strong></div>`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: amt, method, category: 'payroll', desc: 'سداد مستحقات: ' + name });

      // خصم المستحقات الافتتاحية أولاً
      let remaining = amt;
      const openingRecs = (db.workerOpeningReceivables || [])
        .filter(r => r.worker === name && r.status !== 'paid' && (+r.amount || 0) > 0)
        .sort((a, b) => a.id - b.id);
      openingRecs.forEach(r => {
        if (remaining <= 0.01) return;
        const take = Math.min(r.amount, remaining);
        r.amount -= take;
        remaining -= take;
        if (r.amount <= 0.01) r.status = 'paid';
      });

      // بعدين حضور قديم (ننشئ accRecord على تاريخ الحضور عشان التقارير تتحسب صح)
      if (remaining > 0.01) {
        const w = db.workers.find(x => x.name === name);
        if (w) {
          const unpaidAtts = db.attendance
            .filter(a => a.worker === name)
            .filter(a => !db.accRecords.some(r => r.date === a.date && r.desc === 'يومية: ' + name && r.type === 'expense'))
            .map(a => ({ date: a.date, amount: w.daily * (a.ratio || 1) }))
            .sort((a, b) => parseDate(a.date) - parseDate(b.date));

          unpaidAtts.forEach(a => {
            if (remaining <= 0.01) return;
            const take = Math.min(a.amount, remaining);
            db.accRecords.push({
              id: uid(), date: a.date, employee: currentUser.name,
              type: 'expense', amount: take, desc: 'يومية: ' + name, method
            });
            remaining -= take;
          });
        }
      }

      logAction('سداد مستحقات عامل', `${name} - ${fmt(amt)}`);
      saveDB(); closeModal(); toast('تم السداد', 'success'); updateTopbar(); renderAccCollections();
    }
  });
}

function toggleCustomerReturnDetails(idx) {
  const ret = num('cpReturn');
  const div = document.getElementById('custReturnDetails');
  const c = db.customers[idx];
  if (!div) return;

  if (ret > 0) {
    div.classList.remove('hidden');
    const customerOrders = db.distRecords.filter(r => r.name === c.name && r.type === 'أوردر');
    const totalGross = customerOrders.reduce((a, b) => a + (+b.gross || 0), 0);
    const totalDiscount = customerOrders.reduce((a, b) => a + (+b.discount || 0), 0);
    const discountRatio = totalGross > 0 ? (totalDiscount / totalGross) : 0;
    const discountValue = ret * discountRatio;
    const display = document.getElementById('retDiscountDisplay');
    if (display) display.textContent = fmt(discountValue);
  } else {
    div.classList.add('hidden');
  }
  calcCustomerPay(idx);
}

function toggleCustomerTransferStand() {
  const dest = getStr('cpReturnDest');
  const div = document.getElementById('custTransferStandDiv');
  if (!div) return;
  if (dest === 'stand') div.classList.remove('hidden');
  else div.classList.add('hidden');
}

function calcCustomerPay(idx) {
  const c = db.customers[idx];
  const cash = num('cpCash');
  const ret = num('cpReturn');

  const customerOrders = db.distRecords.filter(r => r.name === c.name && r.type === 'أوردر');
  const totalGross = customerOrders.reduce((a, b) => a + (+b.gross || 0), 0);
  const totalDiscount = customerOrders.reduce((a, b) => a + (+b.discount || 0), 0);
  const discountRatio = totalGross > 0 ? (totalDiscount / totalGross) : 0;

  const netRet = ret * (1 - discountRatio);
  const totalReduction = cash + netRet;
  const newDebt = Math.max(0, c.debt - totalReduction);
  const cashRefund = Math.max(0, totalReduction - c.debt);

  const elNet = document.getElementById('calcCustNet');
  const elRetNet = document.getElementById('calcCustRetNet');
  if (elRetNet) elRetNet.textContent = fmt(netRet) + ' ج';
  if (elNet) {
    if (cashRefund > 0) {
      elNet.innerHTML = `<span style="color:#FCA5A5;">رد كاش: ${fmt(cashRefund)} ج</span>`;
    } else {
      elNet.textContent = 'متبقي عليه: ' + fmt(newDebt) + ' ج';
    }
  }
}

function saveCustomerPay() {
  const idx = +document.getElementById('cpIdx').value;
  const c = db.customers[idx];
  const cash = num('cpCash');
  const ret = num('cpReturn');
  const method = getStr('cpMethod', 'cash');
  const retDest = getStr('cpReturnDest', 'oven');
  const transferStand = getStr('cpTransferStand');

  if (cash <= 0 && ret <= 0) return toast('أدخل مبلغ محصل أو مرتجع', 'error');
  if (ret > 0 && retDest === 'stand' && !transferStand) return toast('اختر الاستاند', 'error');

  const customerOrders = db.distRecords.filter(r => r.name === c.name && r.type === 'أوردر');
  const totalGross = customerOrders.reduce((a, b) => a + (+b.gross || 0), 0);
  const totalDiscount = customerOrders.reduce((a, b) => a + (+b.discount || 0), 0);
  const discountRatio = totalGross > 0 ? (totalDiscount / totalGross) : 0;

  const netRet = ret * (1 - discountRatio);
  const discountOnRet = ret - netRet;

  const totalReduction = cash + netRet;
  const newDebt = Math.max(0, c.debt - totalReduction);
  const cashRefund = Math.max(0, totalReduction - c.debt);

  const destText = ret > 0 ? (retDest === 'oven' ? 'مرتجع للفرن' : retDest === 'waste' ? 'هالك' : `تحويل لاستاند ${transferStand}`) : '';

  const summary = `
    <div>العميل: <strong>${esc(c.name)}</strong></div>
    ${cash > 0 ? `<div>كاش محصل: <strong>${fmt(cash)} ج</strong> (${method === 'cash' ? 'كاش' : 'فودافون'})</div>` : ''}
    ${ret > 0 ? `<div>عيش مرتجع: <strong>${fmt(ret)} ج</strong></div>` : ''}
    ${ret > 0 ? `<div style="font-size:12px; color:var(--text-muted);">- خصم نسبي: ${fmt(discountOnRet)} ج</div>` : ''}
    ${ret > 0 ? `<div>- صافي المرتجع: <strong>${fmt(netRet)} ج</strong></div>` : ''}
    ${ret > 0 ? `<div>مصير العيش: <strong>${destText}</strong></div>` : ''}
    <div style="border-top:1px dashed; margin:8px 0; padding-top:8px;">
      ${cashRefund > 0
        ? `<div style="color:var(--danger);">رد كاش للعميل: <strong>${fmt(cashRefund)} ج</strong></div>`
        : `<div>المتبقي عليه: <strong>${fmt(newDebt)} ج</strong></div>`}
    </div>
  `;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      c.debt = newDebt;

      if (cash > 0) {
        db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'in', amount: cash, method, category: 'collection', desc: 'تحصيل آجل من ' + c.name });
      }
      if (cashRefund > 0) {
        db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: cashRefund, method: 'cash', category: 'return_refund', desc: 'رد كاش مرتجع: ' + c.name });
      }

      if (ret > 0) {
        if (retDest === 'oven') {
          db.returns.push({ id: uid(), date: db.date, type: 'مرتجع للفرن', customer: c.name, amount: ret, recordedBy: currentUser.name });
        } else if (retDest === 'waste') {
          db.returns.push({ id: uid(), date: db.date, type: 'هالك', customer: c.name, amount: ret, recordedBy: currentUser.name });
        } else if (retDest === 'stand' && transferStand) {
          let target = db.handovers.find(h => h.date === db.date && h.name === transferStand && h.type === 'استاند');
          if (target) {
            target.amount += ret;
          } else {
            target = { id: uid(), date: db.date, employee: 'غير محدد', type: 'استاند', name: transferStand, amount: ret, paid: 0 };
            db.handovers.push(target);
          }
          db.handoverLines.push({
            id: uid(), handoverId: target.id, date: db.date, type: 'استاند',
            name: transferStand, amount: ret, source: 'order_return',
            desc: `مرتجع أوردر من العميل ${c.name}`, createdAt: db.date
          });
        }
      }

      logAction('تحصيل عميل', `${c.name} - كاش:${cash} مرتجع:${ret}`);
      saveDB();
      closeModal();
      toast('تم التحصيل', 'success');
      updateTopbar();
      renderAccDeferred();
    }
  });
}

        <div style="display:flex; flex-direction:column; padding:12px; border-radius:8px; margin-bottom:10px; gap:10px; border:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <h5 style="font-size:15px; font-weight:900;">${esc(w.name)}</h5>
              <span class="pill" style="background:${ratioColor}20; color:${ratioColor};">${ratioText}</span>
            </div>
            <div style="text-align:left;">
              <div style="font-size:11px; color:var(--text-muted);">اليومية: ${fmt(dailyAmount)} ج</div>
              <div style="font-size:11px; color:var(--danger);">ديون: ${fmt(deductions)} ج</div>
              <div style="font-size:16px; font-weight:900; color:var(--success);">الصافي: ${fmt(net)} ج</div>
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end;">
            ${!isPresent ? '<span class="pill pill-danger">غايب</span>' : isPaid ? '<span class="pill pill-success">✓ تم القبض</span>' : `<button class="btn btn-sm btn-success" onclick="openPayWorkerModal('${esc(w.name)}', ${net}, ${dailyAmount}, ${deductions})">قبض</button>`}
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;
  document.getElementById('accContent').innerHTML = html;
}

function openAttendanceModal() {
  if (db.workers.length === 0) return toast('أضف عمال أولاً', 'error');
  const todayAtt = db.attendance.filter(a => a.date === getViewDate());
  const isFirst = todayAtt.length === 0;

  const rows = db.workers.map(w => {
    const att = todayAtt.find(a => a.worker === w.name);
    const checked = att ? 'checked' : (isFirst ? 'checked' : '');
    const val = att ? att.ratio : 1;
    return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="att_${esc(w.name)}" style="width:20px; height:20px;" ${checked}>
        <label style="margin:0; font-weight:bold;">${esc(w.name)}</label>
      </div>
      <select id="att_ratio_${esc(w.name)}" class="form-control" style="width:130px; padding:6px;">
        <option value="1" ${val == 1 ? 'selected' : ''}>يوم كامل</option>
        <option value="0.5" ${val == 0.5 ? 'selected' : ''}>نصف يوم</option>
      </select>
    </div>`;
  }).join('');

    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveAttendance()">حفظ</button>`);
}

function saveAttendance() {
  const newRecords = [];
  db.workers.forEach(w => {
    const cb = document.getElementById('att_' + w.name);
    if (cb && cb.checked) {
      newRecords.push({ id: uid(), date: db.date, worker: w.name, ratio: parseFloat(document.getElementById('att_ratio_' + w.name).value) || 1 });

  requireSaveConfirm({

      db.attendance = [...db.attendance.filter(a => a.date !== getViewDate()), ...newRecords];
      saveDB(); closeModal(); toast('تم الحفظ', 'success'); renderAccPayroll();

}

function openPayWorkerModal(name, netAmount, dailyAmount, deductions) {
  const canDeduct = deductions > 0.01 && dailyAmount > 0;
  openModal('قبض: ' + name,
    `<div class="summary-box" style="margin-bottom:16px;">
       <div class="summary-row"><span>المستحق:</span><b>${fmt(dailyAmount)} ج</b></div>
       <div class="summary-row"><span>الديون:</span><b style="color:var(--danger)">${fmt(deductions)} ج</b></div>
       ${canDeduct ? `<div class="summary-row total" style="color:var(--success);"><span>الصافي:</span><span>${fmt(netAmount)} ج</span></div>` : ''}
     </div>
     <div class="form-group"><label>طريقة القبض</label><select id="payWorkerMethod" class="form-control"><option value="cash">كاش</option><option value="vodafone">فودافون</option></select></div>
     ${canDeduct ? `
       <div style="display:flex; flex-direction:column; gap:8px;">
         <button class="btn btn-success btn-lg" onclick="doPayWorker('${esc(name)}', ${dailyAmount}, ${deductions}, false)">اقبض الكل (${fmt(dailyAmount)})</button>
         <button class="btn btn-accent btn-lg" onclick="doPayWorker('${esc(name)}', ${dailyAmount}, ${deductions}, true)">خصم الدين واقبض (${fmt(netAmount)})</button>
       </div>
     ` : `
       <button class="btn btn-success btn-lg btn-block" onclick="doPayWorker('${esc(name)}', ${dailyAmount}, ${deductions}, false)">قبض ${fmt(dailyAmount)} ج</button>
     `}`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>`
  );
}

function doPayWorker(name, dailyAmount, deductions, shouldDeduct) {
  const method = getStr('payWorkerMethod', 'cash');
  const finalPay = shouldDeduct ? Math.max(0, dailyAmount - deductions) : dailyAmount;
  if (finalPay > 0 && finalPay > getCashBalanceByMethod(method) + 0.01) return toast('رصيد غير كافي', 'error');

  const summary = `<div>العامل: <strong>${esc(name)}</strong></div><div>المستحق: <strong>${fmt(dailyAmount)} ج</strong></div><div>سيتم دفع: <strong>${fmt(finalPay)} ج</strong></div>${shouldDeduct ? '<div style="color:var(--warning);">مع خصم الديون</div>' : ''}`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      db.accRecords.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'expense', amount: dailyAmount, desc: 'يومية: ' + name, method });
      if (finalPay > 0) {
        db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: finalPay, method, category: 'payroll', desc: 'قبض عامل: ' + name });
      }
      if (shouldDeduct) {
        let rem = Math.min(deductions, dailyAmount);
        const debts = db.workerLedger.filter(l => l.worker === name && l.status !== 'paid').sort((a, b) => a.id - b.id);
        for (let debt of debts) {
          if (rem <= 0.01) break;
          if (debt.amount <= rem) { rem -= debt.amount; debt.amount = 0; debt.status = 'paid'; }
          else { debt.amount -= rem; rem = 0; }
        }
      }
      saveDB(); closeModal(); toast('تم', 'success'); updateTopbar(); renderAccPayroll();
    }
  });
}

  if (db.workers.length === 0) return toast('لا يوجد عمال', 'error');

function renderAccPurchases() {

function openPurchaseModal() {
  if (!db.suppliers.length) return toast('أضف موردين أولاً', 'error');
  const opts = db.suppliers.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');

  openModal('فاتورة مشتريات',
    `<div class="form-group"><label>المورد</label><select id="pSup" class="form-control">${opts}</select></div>
     <div id="purchaseItemsList"></div>
     <button type="button" class="btn btn-sm btn-secondary" onclick="addPurchaseItemRow()" style="margin-top:8px;"><i class="fas fa-plus"></i> صنف</button>
     <div class="summary-box" style="margin-top:16px;">
       <div class="summary-row"><span>الإجمالي:</span><span id="pTotalDisplay">0 ج</span></div>
       <div class="form-row" style="margin-top:10px;">
         <div class="form-group"><label>المدفوع</label><input type="text" inputmode="numeric" id="pPaid" class="form-control" oninput="blockInt(this);calcPurchasePay()"></div>
         <div class="form-group"><label>الطريقة</label><select id="pMethod" class="form-control"><option value="cash">كاش</option><option value="vodafone">فودافون</option></select></div>
       </div>

}

function addPurchaseItemRow() {
  const opts = Object.keys(db.inventory).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
  const id = 'pRow_' + Date.now();
  document.getElementById('purchaseItemsList').insertAdjacentHTML('beforeend', `
    <div class="form-row" id="${id}" style="margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border);">
      <div style="grid-column: span 2;"><select class="form-control p-item">${opts}</select></div>
      <div><input type="text" class="form-control p-qty" placeholder="كمية" inputmode="decimal" oninput="blockDec(this);updatePurchaseCalc()"></div>
      <div style="display:flex; gap:4px;">
        <input type="text" class="form-control p-price" placeholder="سعر" inputmode="numeric" oninput="blockInt(this);updatePurchaseCalc()">
        <button class="btn btn-sm btn-danger" onclick="document.getElementById('${id}').remove();updatePurchaseCalc();"><i class="fas fa-times"></i></button>
      </div>
    </div>
  `);
  updatePurchaseCalc();
}

function updatePurchaseCalc() {
  let total = 0;
  document.querySelectorAll('#purchaseItemsList .form-row').forEach(row => {
    total += (parseFloat(row.querySelector('.p-qty').value) || 0) * (parseFloat(row.querySelector('.p-price').value) || 0);
  });
  if ($('pTotalDisplay')) $('pTotalDisplay').textContent = fmt(total) + ' ج';
  const paid = num('pPaid');
  if ($('pDebt')) $('pDebt').textContent = fmt(Math.max(0, total - paid)) + ' ج';
}

function calcPurchasePay() { updatePurchaseCalc(); }

function savePurchase() {
  const sup = getStr('pSup'), paid = num('pPaid'), method = getStr('pMethod', 'cash');
  let total = 0;
  const items = [];

  document.querySelectorAll('#purchaseItemsList .form-row').forEach(row => {
    const item = row.querySelector('.p-item').value;
    const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
    const price = parseFloat(row.querySelector('.p-price').value) || 0;
    if (qty > 0 && price > 0) { total += (qty * price); items.push({ item, qty, price }); }
  });

  if (items.length === 0) return toast('أضف صنف', 'error');
  if (paid > total) return toast('المدفوع أكبر من الإجمالي', 'error');
  if (paid > 0 && paid > getCashBalanceByMethod(method) + 0.01) return toast('رصيد غير كافي', 'error');

  const debt = total - paid;
  const summary = `<div>المورد: <strong>${esc(sup)}</strong></div><div>الإجمالي: <strong>${fmt(total)} ج</strong></div><div>مدفوع: <strong>${fmt(paid)} ج</strong></div>${debt > 0 ? `<div style="color:var(--warning);">دين: <strong>${fmt(debt)} ج</strong></div>` : ''}`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      items.forEach(inv => {
        addInventory(inv.item, inv.qty, inv.price);
        db.invLog.push({ id: uid(), date: db.date, type: 'in', item: inv.item, qty: inv.qty, desc: `مشتريات من ${sup}`, cost: inv.qty * inv.price });
      });
      if (paid > 0) db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: paid, method, category: 'purchase', desc: `مشتريات من ${sup}` });
      if (debt > 0) { const s = db.suppliers.find(x => x.name === sup); if (s) s.debt += debt; }
      logAction('مشتريات', `${sup} - ${fmt(total)} ج`);
      saveDB(); closeModal(); toast('تم الحفظ', 'success'); updateTopbar(); renderAccPurchases();
    }
  });
}

function renderAccSuppliers() {
  const suppliers = db.suppliers.filter(s => (+s.debt || 0) > 0);
  const total = suppliers.reduce((a, b) => a + (+b.debt || 0), 0);

  document.getElementById('accContent').innerHTML = `
    <div class="card" style="background:var(--primary-); color:#fff; text-align:center; margin-bottom:16px;">
      <div style="font-size:14px; color:rgba(255,255,255,0.7);">إجمالي ديون الموردين</div>

    </div>
    <div class="card">
      ${suppliers.length ? suppliers.map(s => `
        <div style="display:flex; flex-direction:column; padding:12px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; gap:10px;">
          <div style="display:flex; justify-content:space-between;">
            <h5 style="font-size:15px; font-weight:900;">${esc(s.name)}</h5>

          </div>

        </div>
      `).join('') : '<p class="table-empty">لا يوجد ديون</p>'}
    </div>
  `;
}

function openSupplierPayModal(name) {
  const s = db.suppliers.find(x => x.name === name);
  if (!s) return;
  openModal('سداد للمورد: ' + name,
    `<div class="summary-box" style="margin-bottom:16px;"><div class="summary-row total" style="color:var(--danger);"><span>الدين:</span><span>${fmt(s.debt)} ج</span></div></div>
     <div class="form-group"><label>المبلغ</label><input type="text" inputmode="numeric" id="spAmt" class="form-control" oninput="blockInt(this)"></div>

    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveSupplierPay('${esc(name)}')">تأكيد</button>`
  );
}

function saveSupplierPay(name) {
  const s = db.suppliers.find(x => x.name === name), amt = num('spAmt'), method = getStr('spMethod', 'cash');
  if (amt <= 0 || amt > s.debt) return toast('مبلغ غير صحيح', 'error');
  if (amt > getCashBalanceByMethod(method) + 0.01) return toast('رصيد غير كافي', 'error');

  const summary = `<div>المورد: <strong>${esc(name)}</strong></div><div>المبلغ: <strong>${fmt(amt)} ج</strong></div>`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      s.debt -= amt;
      db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: amt, method, category: 'supplier_payment', desc: 'سداد لـ ' + name });
      logAction('سداد مورد', `${name} - ${fmt(amt)}`);
      saveDB(); closeModal(); toast('تم', 'success'); updateTopbar(); renderAccSuppliers();
    }
  });
}

function renderAccExpenses() {
  const recs = db.accRecords.filter(r => r.type === 'expense');

  document.getElementById('accContent').innerHTML = `

    <div class="summary-box" style="margin-bottom:16px; text-align:center;">

      <div style="font-size:20px; font-weight:900; color:var(--danger);">${fmt(total)} ج</div>
    </div>
    <div class="card">
      ${recs.length ? recs.slice().reverse().map(r => `
        <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border);">
          <div><div style="font-weight:900;">${esc(r.desc)}</div><div style="font-size:11px; color:var(--text-muted);">${esc(r.date)} | ${r.method === 'vodafone' ? '📱' : '💵'}</div></div>
          <div style="font-weight:900; color:var(--danger);">${fmt(r.amount)} ج</div>
        </div>
      `).join('') : '<p class="table-empty">لا يوجد مصروفات</p>'}
    </div>
  `;
}

function openExpenseModal() {
  openModal('إضافة مصروف',
    `<div class="form-group"><label>البيان</label><input type="text" id="expDesc" class="form-control"></div>
     <div class="form-group"><label>المبلغ</label><input type="text" inputmode="numeric" id="expAmt" class="form-control" oninput="blockInt(this)"></div>
     <div class="form-group"><label>الطريقة</label><select id="expMethod" class="form-control"><option value="cash">كاش</option><option value="vodafone">فودافون</option></select></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveExpense()">حفظ</button>`
  );
}

function saveExpense() {
  const desc = getStr('expDesc'), amt = num('expAmt'), method = getStr('expMethod', 'cash');
  if (!desc || amt <= 0) return toast('أكمل البيانات', 'error');
  if (amt > getCashBalanceByMethod(method) + 0.01) return toast('رصيد غير كافي', 'error');

  const summary = `<div>${esc(desc)}: <strong>${fmt(amt)} ج</strong></div>`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      db.accRecords.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'expense', amount: amt, desc, method });
      db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'out', amount: amt, method, category: 'expense', desc: 'مصروف: ' + desc });
      logAction('مصروف', desc);
      saveDB(); closeModal(); toast('تم', 'success'); updateTopbar(); renderAccExpenses();
    }
  });
}

function openStocktakeModal() {
  const opts = Object.keys(db.inventory).map(k => `<option value="${esc(k)}">${esc(k)} (${fmt(db.inventory[k])} ${esc(db.itemUnits[k])})</option>`).join('');
  openModal('جرد وتسوية',
    `<div class="form-group"><label>الصنف</label><select id="stkItem" class="form-control" onchange="calcStocktake()">${opts}</select></div>
     <div class="form-group"><label>الكمية الفعلية</label><input type="text" inputmode="decimal" id="stkQty" class="form-control" oninput="blockDec(this);calcStocktake()"></div>
     <div class="summary-box" style="margin-top:16px;">
       <div class="summary-row"><span>الرصيد الدفتري:</span><b id="stkCur">0</b></div>
       <div class="summary-row"><span>الفرق:</span><b id="stkDiff" style="color:var(--warning);">0</b></div>
       <div class="summary-row total"><span>قيمة التسوية:</span><span id="stkVal">0 ج</span></div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveStocktake()">تأكيد الجرد</button>`
  );
  calcStocktake();
}

function calcStocktake() {
  const item = getStr('stkItem');
  const actual = num('stkQty');
  const cur = getInventoryQty(item);
  const diff = actual - cur;
  const avg = getInventoryAvgPrice(item);
  if ($('stkCur')) $('stkCur').textContent = fmt(cur);
  if ($('stkDiff')) { $('stkDiff').textContent = (diff > 0 ? '+' : '') + fmt(diff); $('stkDiff').style.color = diff < 0 ? 'var(--danger)' : diff > 0 ? 'var(--success)' : 'var(--text)'; }
  if ($('stkVal')) $('stkVal').textContent = fmt(diff * avg) + ' ج';
}

function saveStocktake() {
  const item = getStr('stkItem');
  const actual = num('stkQty');
  const cur = getInventoryQty(item);
  if (actual < 0) return toast('كمية سالبة', 'error');
  const diff = actual - cur;
  if (Math.abs(diff) < 0.001) return toast('لا يوجد فرق', 'info');
  const avg = getInventoryAvgPrice(item);
  const diffVal = diff * avg;
  const desc = diff > 0 ? 'تسوية جرد (زيادة)' : 'تسوية جرد (عجز)';

  const summary = `<div>الصنف: <strong>${esc(item)}</strong></div><div>الرصيد الحالي: ${fmt(cur)}</div><div>الفعلي: ${fmt(actual)}</div><div style="color:${diff > 0 ? 'var(--success)' : 'var(--danger)'};">الفرق: <strong>${diff > 0 ? '+' : ''}${fmt(diff)}</strong></div><div>القيمة: <strong>${fmt(Math.abs(diffVal))} ج</strong></div>`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      adjustInventoryLayers(item, diff, avg);
      db.invLog.push({ id: uid(), date: db.date, type: diff > 0 ? 'in' : 'out', item, qty: Math.abs(diff), desc, cost: Math.abs(diffVal) });
      if (diff < 0) {
        db.accRecords.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'expense', amount: Math.abs(diffVal), desc: 'عجز جرد: ' + item, method: 'cash' });
      }
      logAction('جرد مخزن', `${item} - ${desc}`);
      saveDB(); closeModal(); toast('تم التسوية', 'success'); nav('inventory');
    }
  });
}

function addWorker() {
  const name = getStr('nwName'), daily = num('nwDaily');

  db.workers.push({ name, daily }); saveDB(); toast('تمت الإضافة', 'success'); renderWorkers();
}

function editWorker(i) {
  const w = db.workers[i];
  openModal('تعديل: ' + w.name,
    `<div class="form-group"><label>الاسم</label><input type="text" id="ewName" class="form-control" value="${esc(w.name)}"></div>
     <div class="form-group"><label>اليومية</label><input type="text" inputmode="numeric" id="ewDaily" class="form-control" value="${w.daily}" oninput="blockInt(this)"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveEditWorker(${i})">حفظ</button>`
  );
}

function saveEditWorker(i) {
  const w = db.workers[i], newName = getStr('ewName'), newDaily = num('ewDaily');
  if (!newName || newDaily <= 0) return toast('أكمل البيانات', 'error');
  if (w.name !== newName) {
    db.workerLedger.forEach(l => { if (l.worker === w.name) l.worker = newName; });
    db.attendance.forEach(a => { if (a.worker === w.name) a.worker = newName; });
    db.workerOpeningReceivables.forEach(r => { if (r.worker === w.name) r.worker = newName; });
  }
  w.name = newName; w.daily = newDaily;
  saveDB(); closeModal(); toast('تم التعديل', 'success'); renderWorkers();
}

function deleteWorker(i) {
  requireAdminPin('حذف عامل', () => {
    const w = db.workers[i];
    if (getWorkerDebts(w.name) > 0.01 || getWorkerReceivable(w.name) > 0.01) return toast('لا يمكن الحذف — يوجد أرصدة', 'error');
    db.workers.splice(i, 1); saveDB(); toast('تم الحذف', 'success'); renderWorkers();
  });
}

function viewWorkerStatement(name) {
  const worker = db.workers.find(w => w.name === name);
  if (!worker) return;

  const transactions = [];

  db.workerLedger.filter(l => l.worker === name).forEach(l => {
    transactions.push({ date: l.date, desc: l.type + (l.desc ? ' - ' + l.desc : ''), type: 'debit', amount: +l.amount || 0 });
  });

  (db.workerOpeningReceivables || []).filter(r => r.worker === name).forEach(r => {
    transactions.push({ date: r.date, desc: 'مستحق افتتاحي', type: 'credit', amount: +r.amount || 0 });
  });

  db.attendance.filter(a => a.worker === name).forEach(a => {
    transactions.push({ date: a.date, desc: 'يومية (حضور)', type: 'credit', amount: worker.daily * (a.ratio || 1) });
  });

  // ✅ إصلاح: مطابقة دقيقة بدل includes
  db.treasury.filter(t =>
    t.type === 'out' &&
    t.category === 'payroll' &&
    (t.desc === 'قبض عامل: ' + name || t.desc === 'سداد مستحقات: ' + name)
  ).forEach(t => {
    transactions.push({ date: t.date, desc: t.desc, type: 'debit', amount: t.amount });
  });

  transactions.sort((a, b) => parseDate(a.date) - parseDate(b.date));

  const totalDebit = transactions.filter(t => t.type === 'debit').reduce((a, b) => a + b.amount, 0);
  const totalCredit = transactions.filter(t => t.type === 'credit').reduce((a, b) => a + b.amount, 0);
  const net = totalCredit - totalDebit;

  let tableHTML = `<table style="width:100%; border-collapse:collapse; margin-top:10px; text-align:center; font-size:12px;">
    <thead><tr>
      <th style="border:1px solid #ccc; padding:6px;">التاريخ</th>
      <th style="border:1px solid #ccc; padding:6px;">البيان</th>
      <th style="border:1px solid #ccc; padding:6px; color:var(--danger);">عليه</th>
      <th style="border:1px solid #ccc; padding:6px; color:var(--success);">له</th>
    </tr></thead>
    <tbody>${transactions.map(t => `<tr>

function viewCustomerStatement(name) {
  const customer = db.customers.find(c => c.name === name);
  if (!customer) return;

  const transactions = [];

  db.distRecords.filter(r => r.name === name && r.type === 'أوردر').forEach(r => {
    if ((+r.debtAmount || 0) > 0) {
      transactions.push({ date: r.date, desc: 'أوردر آجل', type: 'debit', amount: +r.debtAmount });
    }
  });

  db.treasury.filter(t => (t.desc === 'تحصيل آجل من ' + name || t.desc === 'دفعة أوردر: ' + name) && t.type === 'in').forEach(t => {
    transactions.push({ date: t.date, desc: t.desc, type: 'credit', amount: +t.amount });
  });

  db.returns.filter(r => r.customer === name && (r.type === 'مرتجع للفرن' || r.type === 'هالك')).forEach(r => {
    transactions.push({ date: r.date, desc: 'مرتجع (' + r.type + ')', type: 'credit', amount: +r.amount });
  });

  transactions.sort((a, b) => parseDate(a.date) - parseDate(b.date));

  const totalDebit = transactions.filter(t => t.type === 'debit').reduce((a, b) => a + b.amount, 0);
  const totalCredit = transactions.filter(t => t.type === 'credit').reduce((a, b) => a + b.amount, 0);

  let tableHTML = `<table style="width:100%; border-collapse:collapse; margin-top:10px; text-align:center; font-size:12px;">
    <thead><tr><th style="border:1px solid #ccc; padding:6px;">التاريخ</th><th style="border:1px solid #ccc; padding:6px;">البيان</th><th style="border:1px solid #ccc; padding:6px; color:var(--danger);">عليه</th><th style="border:1px solid #ccc; padding:6px; color:var(--success);">له</th></tr></thead>
    <tbody>${transactions.map(t => `<tr>
      <td style="border:1px solid #ccc; padding:6px;">${esc(t.date)}</td>
      <td style="border:1px solid #ccc; padding:6px;">${esc(t.desc)}</td>
      <td style="border:1px solid #ccc; padding:6px; color:var(--danger);">${t.type === 'debit' ? fmt(t.amount) : '-'}</td>
      <td style="border:1px solid #ccc; padding:6px; color:var(--success);">${t.type === 'credit' ? fmt(t.amount) : '-'}</td>
    </tr>`).join('') || '<tr><td colspan="4" style="padding:10px;">لا يوجد</td></tr>'}</tbody>
  </table>`;

  const waText = `🏪 *${db.settings.storeName || 'مخبوزات أبو يونس'}*\n👤 *كشف حساب: ${name}*\n📅 ${today()}\n\n` +
    transactions.map(t => `${t.date} | ${t.desc} | ${t.type === 'debit' ? 'عليه' : 'دفعة/مرتجع'}: ${fmt(t.amount)} ج`).join('\n') +
    `\n\n*المبيعات:* ${fmt(totalDebit)} ج\n*المدفوع:* ${fmt(totalCredit)} ج\n*المديونية:* ${fmt(customer.debt)} ج`;

  openModal('كشف حساب: ' + name,
    `<div class="summary-box" style="margin-bottom:16px;">
       <div class="summary-row"><span>المبيعات:</span><b style="color:var(--danger)">${fmt(totalDebit)} ج</b></div>
       <div class="summary-row"><span>المدفوع + المرتجعات:</span><b style="color:var(--success)">${fmt(totalCredit)} ج</b></div>
       <div class="summary-row total" style="color:var(--danger);"><span>المديونية الحالية:</span><span>${fmt(customer.debt)} ج</span></div>
     </div>${tableHTML}`,
    `<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>${waBtn(waText)}`
  );
}

function openUserPermissionsModal(userIndex) {

  ];

        <label style="display:flex; align-items:center; gap:5px; font-size:12px;"><input type="checkbox" id="edit_${sec.id}" ${currentEdit.includes(sec.id) ? 'checked' : ''} onchange="togglePerm('${sec.id}','edit')"> تعديل</label>

  openModal('صلاحيات: ' + u.name,

    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-accent" onclick="saveUserPermissions(${userIndex})">حفظ</button>`
  );
}

function togglePerm(secId, type) {
  const v = document.getElementById('view_' + secId);
  const e = document.getElementById('edit_' + secId);
  if (type === 'view' && !v.checked) e.checked = false;
  if (type === 'edit' && e.checked) v.checked = true;
}

  const u = db.users[i];
  const sections = ['dashboard', 'production', 'distribution', 'inventory', 'accounting', 'reports', 'admin'];

async function uploadToDrive() {
  const url = db.settings.driveUrl;
  if (!url) return toast('أدخل الرابط أولاً', 'warning');
  toast('جاري الرفع...', 'info');
  try {
    const payload = JSON.stringify(db);
    const res = await fetch(url, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    const data = await res.json();
    if (data.success) { toast('✅ تم الرفع', 'success'); logAction('رفع Drive', data.filename || ''); }
    else toast('فشل: ' + (data.error || 'خطأ'), 'error');
  } catch (e) { toast('فشل الاتصال', 'error'); }
}

async function restoreFromDrive() {
  const url = db.settings.driveUrl;
  if (!url) return toast('أدخل الرابط أولاً', 'warning');
  toast('جاري الجلب...', 'info');
  try {
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    if (data.success && data.data) {
      showConfirm('استعادة', `استعادة <b>${esc(data.filename)}</b>؟`, () => {
        requireAdminPin('استعادة', () => {
          try {
            db = deepMerge(defaultDB, JSON.parse(data.data));
            saveDB(); toast('تمت الاستعادة', 'success');
            setTimeout(() => location.reload(), 1500);
          } catch (err) { toast('نسخة تالفة', 'error'); }
        });
      }, true);
    } else toast('لا يوجد نسخ', 'error');
  } catch (e) { toast('فشل الاتصال', 'error'); }
}

function downloadBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bakery_v18_' + today().replace(/\//g, '-') + '.json';
  a.click();
  toast('تم التحميل', 'success');
}

function restoreBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.version) return toast('ملف غير صالح', 'error');
      showConfirm('استعادة', 'استبدال البيانات الحالية؟', () => {
        requireAdminPin('استعادة', () => {
          db = deepMerge(defaultDB, data); saveDB();
          toast('تمت الاستعادة', 'success');
          setTimeout(() => location.reload(), 1000);
        });
      }, true);
    } catch { toast('ملف تالف', 'error'); }
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════
   الرسوم البيانية (SVG خفيفة بدون مكتبات) 🆕
   ═══════════════════════════════════════════════════════════ */
function getLast7DaysData() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toLocaleDateString('en-GB');
    const rev = db.distRecords.filter(r => r.date === dateStr && r.type !== 'مرتجع').reduce((a, b) => a + (+b.money || 0), 0);
    const exp = db.accRecords.filter(r => r.date === dateStr && r.type === 'expense').reduce((a, b) => a + (+b.amount || 0), 0);
    const prod = db.production.filter(r => r.date === dateStr && r.type !== 'consumables').reduce((a, b) => a + (+b.netMoney || 0), 0);
    const label = d.toLocaleDateString('ar-EG', { weekday: 'short' });
    days.push({ date: dateStr, rev, exp, prod, label });
  }
  return days;
}

function renderLineChart(data, valueKey, color, w = 320, h = 100) {
  if (!data.length) return '';
  const max = Math.max(...data.map(d => d[valueKey]), 1);
  const padX = 10, padY = 15;
  const innerW = w - padX * 2;
  const innerH = h - padY * 2;
  const pointW = data.length > 1 ? innerW / (data.length - 1) : 0;

  const pts = data.map((d, i) => {
    const x = padX + i * pointW;
    const y = padY + innerH - (d[valueKey] / max) * innerH;
    return { x, y };
  });

  const lineStr = pts.map(p => `${p.x},${p.y}`).join(' ');
  const areaStr = `${padX},${padY + innerH} ${lineStr} ${padX + innerW},${padY + innerH}`;

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
      <polygon points="${areaStr}" fill="${color}" opacity="0.15"/>
      <polyline points="${lineStr}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}" stroke="white" stroke-width="1.5"/>`).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:10px; color:var(--text-muted);">
      ${data.map(d => `<span>${d.label}</span>`).join('')}
    </div>
  `;
}

function renderBarChart(data, valueKey, color, w = 320, h = 100) {
  if (!data.length) return '';
  const max = Math.max(...data.map(d => d[valueKey]), 1);
  const padX = 5, padY = 15;
  const innerW = w - padX * 2;
  const innerH = h - padY * 2;
  const slotW = innerW / data.length;
  const barW = slotW * 0.7;

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
      ${data.map((d, i) => {
        const x = padX + i * slotW + (slotW - barW) / 2;
        const barH = (d[valueKey] / max) * innerH;
        const y = padY + innerH - barH;
        return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" rx="2"/>`;
      }).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:10px; color:var(--text-muted);">
      ${data.map(d => `<span>${d.label}</span>`).join('')}
    </div>
  `;
}

renderers.notifications = function () {
  const content = document.getElementById('content');
  const alerts = [];
  const role = currentUser ? currentUser.role : 'admin';

  // 1. العهد
  if (role === 'admin' || role === 'accountant' || role === 'distribution') {
    const openHandovers = db.handovers.filter(h => h.date === getViewDate() && h.paid < h.amount);

function runSmartArchive() {
  const daysToKeep = 90;
  const cutoffTime = new Date(Date.now() - daysToKeep * 86400000).getTime();

  const allDates = new Set();
  [...db.production, ...db.distRecords, ...db.accRecords, ...db.treasury, ...db.handovers].forEach(r => allDates.add(r.date));
  const oldDates = [...allDates].filter(d => { const t = parseDate(d); return t > 0 && t < cutoffTime; });

  if (oldDates.length === 0) return toast('لا يوجد أيام قديمة', 'info');

  showConfirm('الأرشيف الذكي', `أرشفة <b>${oldDates.length} يوم</b>؟`, () => {
    try {
      const isOld = (r) => { const t = parseDate(r.date); return t > 0 && t < cutoffTime; };
      const oldTxns = db.treasury.filter(r => isOld(r));
      const oldCash = oldTxns.filter(t => t.method === 'cash' || !t.method).reduce((a, b) => a + (b.type === 'in' ? b.amount : -b.amount), 0);
      const oldVoda = oldTxns.filter(t => t.method === 'vodafone').reduce((a, b) => a + (b.type === 'in' ? b.amount : -b.amount), 0);

      oldDates.forEach(d => {
        if (!db.archivedDays.find(a => a.date === d)) {
          db.archivedDays.push({
            date: d, archivedAt: new Date().toISOString(),
            production: db.production.filter(r => r.date === d),
            distRecords: db.distRecords.filter(r => r.date === d),
            accRecords: db.accRecords.filter(r => r.date === d),
            treasury: db.treasury.filter(r => r.date === d),
            handovers: db.handovers.filter(r => r.date === d),
            returns: db.returns.filter(r => r.date === d),
            workerLedger: db.workerLedger.filter(r => r.date === d),
            invLog: db.invLog.filter(r => r.date === d)
          });
        }
      });

      db.production = db.production.filter(r => !isOld(r));
      db.distRecords = db.distRecords.filter(r => !isOld(r));
      db.accRecords = db.accRecords.filter(r => !isOld(r));
      db.treasury = db.treasury.filter(r => !isOld(r));
      db.returns = db.returns.filter(r => !isOld(r));
      db.eatingBread = db.eatingBread.filter(r => !isOld(r));
      db.attendance = db.attendance.filter(r => !isOld(r));
      db.invLog = db.invLog.filter(r => !isOld(r));
      db.handovers = db.handovers.filter(r => !isOld(r) || r.paid < r.amount);
      db.workerLedger = db.workerLedger.filter(r => !isOld(r) || r.status !== 'paid');

      if (Math.abs(oldCash) > 0.01) {
        db.treasury.push({ id: uid(), date: today(), employee: 'النظام', type: oldCash > 0 ? 'in' : 'out', amount: Math.abs(oldCash), method: 'cash', category: 'archive_carry', desc: 'رصيد مُرحّل' });
      }
      if (Math.abs(oldVoda) > 0.01) {
        db.treasury.push({ id: uid(), date: today(), employee: 'النظام', type: oldVoda > 0 ? 'in' : 'out', amount: Math.abs(oldVoda), method: 'vodafone', category: 'archive_carry', desc: 'رصيد مُرحّل' });
      }

      saveDB(); toast('✅ تمت الأرشفة', 'success');
      setTimeout(() => location.reload(), 1500);
    } catch (err) { console.error(err); toast('خطأ: ' + err.message, 'error'); }
  }, true);
}
</script>

  week:      { label: 'آخر 7 أيام',    icon: 'calendar-week' },

  thisMonth: { label: 'هذا الشهر',     icon: 'calendar' },
  lastMonth: { label: 'الشهر الماضي',  icon: 'calendar' },
  year:      { label: 'هذه السنة',     icon: 'calendar' },
  all:       { label: 'الكل',          icon: 'infinity' }
};

function getPresetDates(preset) {
  const t = new Date();
  let from, to;
  switch (preset) {
    case 'today':     from = to = t; break;
    case 'yesterday': from = to = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1); break;
    case 'week':      from = new Date(t); from.setDate(t.getDate() - 6); to = t; break;
    case 'month':     from = new Date(t); from.setDate(t.getDate() - 29); to = t; break;
    case 'thisMonth': from = new Date(t.getFullYear(), t.getMonth(), 1); to = t; break;
    case 'lastMonth': from = new Date(t.getFullYear(), t.getMonth() - 1, 1); to = new Date(t.getFullYear(), t.getMonth(), 0); break;
    case 'year':      from = new Date(t.getFullYear(), 0, 1); to = t; break;
    case 'all': {
      let earliest = t;
      const allDates = [...db.production.map(r => parseDate(r.date)), ...db.distRecords.map(r => parseDate(r.date)), ...db.treasury.map(r => parseDate(r.date)), ...db.accRecords.map(r => parseDate(r.date))].filter(d => d > 0);
      if (allDates.length) earliest = new Date(Math.min(...allDates));
      from = earliest; to = t; break;
    }
    default: return;
  }
  repFromDate = from.toLocaleDateString('en-GB');
  repToDate = to.toLocaleDateString('en-GB');
}

function setRepPreset(preset) {
  repActivePreset = preset;

/* ═══════════════════════════════════════════════════════════
   🎯 computeProfitPeriod — المنهج الموحد للربح (v18.1) 🆕
   
   كل التقارير تستخدم الدالة دي، عشان الأرقام تتطابق دايماً:
   - P&L
   - Comprehensive
   - Growth
   
   المنهج المحاسبي الصحيح:
   1. الإيراد الإجمالي = مبيعات (gross) - خصومات
   2. COGS = تكلفة الإنتاج × نسبة الكمية الموزعة (بعدد الأرغفة مش بالقيمة)
   3. الهالك = خسارة منفصلة (مش تخفيض إيراد)
   4. مرتجع الفرن = مفيش تأثير (البضاعة رجعت للمخزون)
   5. المصروفات = أجور (استحقاق) + أخرى
   6. صافي الربح = الإيراد - COGS - الهالك - المصروفات
   ═══════════════════════════════════════════════════════════ */
function computeProfitPeriod(fromDate, toDate) {
  // 1) المبيعات
  const dists = db.distRecords.filter(r => inRange(r.date, fromDate, toDate) && r.type !== 'مرتجع');
  
  const standsGross = dists.filter(r => r.type === 'استاند').reduce((a, b) => a + (+b.gross || +b.money || 0), 0);
  const ordersGross = dists.filter(r => r.type === 'أوردر').reduce((a, b) => a + (+b.gross || 0), 0);
  const directGross = dists.filter(r => r.type === 'بيع مباشر').reduce((a, b) => a + (+b.gross || +b.money || 0), 0);
  const totalGrossSales = standsGross + ordersGross + directGross;
  
  const totalDiscount = dists.filter(r => r.type === 'أوردر').reduce((a, b) => a + (+b.discount || 0), 0);
  const netRevenue = totalGrossSales - totalDiscount;

  // 2) COGS — بالكمية (عدد الأرغفة) مش بالقيمة
  const prods = db.production.filter(r => inRange(r.date, fromDate, toDate));
  const batchProds = prods.filter(r => r.type !== 'consumables');
  const totalProdCost = prods.reduce((a, b) => a + (+b.cost || 0), 0);
  const totalNetBreads = batchProds.reduce((a, b) => a + (+b.netBreads || 0), 0);
  
  // نستخدم نسبة الكمية الموزعة لعدد الأرغفة المنتجة
  const totalDistributedTawla = batchProds.reduce((a, b) => a + (+b.tawla || 0), 0);
  const bpT = db.settings.breadPerTawla || 20;
  const totalDistBreads = totalGrossSales / (db.settings.breadPrice || 1);
  
  // نسبة الأرغفة الموزعة (تقريبية بناءً على القيمة)
  let distributedRatio = 0;
  if (totalNetBreads > 0) {
    distributedRatio = Math.min(1, totalDistBreads / totalNetBreads);
  }
  const cogs = totalProdCost * distributedRatio;

  // 3) الهالك (خسارة منفصلة — مش تخفيض إيراد)
  const wasteReturns = db.returns.filter(r => inRange(r.date, fromDate, toDate) && r.type === 'هالك').reduce((a, b) => a + (+b.amount || 0), 0);
  
  // مرتجع الفرن — للعرض بس (البضاعة رجعت للمخزون = مفيش تأثير على PL)
  const ovenReturns = db.returns.filter(r => inRange(r.date, fromDate, toDate) && r.type === 'مرتجع للفرن').reduce((a, b) => a + (+b.amount || 0), 0);

  // 4) المصروفات
  // 4-أ) أجور (استحقاق - من attendance)
  const attendanceInPeriod = db.attendance.filter(a => inRange(a.date, fromDate, toDate));
  let payrollExp = 0;
  attendanceInPeriod.forEach(a => {
    const w = db.workers.find(x => x.name === a.worker);
    if (w) payrollExp += (w.daily * (a.ratio || 1));
  });

  // 4-ب) باقي المصروفات (بدون اليوميات عشان ما نكررهاش)
  const expenses = db.accRecords.filter(r => inRange(r.date, fromDate, toDate) && r.type === 'expense');
  const otherExp = expenses.filter(r => !String(r.desc || '').includes('يومية')).reduce((a, b) => a + (+b.amount || 0), 0);

  // 5) عيش للأكل
  const eating = db.eatingBread.filter(r => inRange(r.date, fromDate, toDate)).reduce((a, b) => a + (+b.amount || 0), 0);

  // 6) الأرباح
  const grossProfit = netRevenue - cogs;
  const netProfit = grossProfit - wasteReturns - payrollExp - otherExp - eating;

  return {
    // مبيعات
    standsGross, ordersGross, directGross, totalGrossSales,
    totalDiscount, netRevenue,
    // تكلفة
    totalProdCost, totalNetBreads, distributedRatio, cogs,
    // خسائر
    wasteReturns, ovenReturns,
    // مصروفات
    payrollExp, otherExp, eating,
    // أرباح
    grossProfit, netProfit
  };
}

/* ═══════════════════════════════════════════════════════════
   تحليل النمو — بالمنهج الموحد
   ═══════════════════════════════════════════════════════════ */
function renderRepGrowth() {
  const now = new Date();
  let cStart, cEnd, pStart, pEnd, titleCur, titlePrev;

  if (growthCompareType === 'month') {
    const dayOfMonth = now.getDate();
    cStart = new Date(now.getFullYear(), now.getMonth(), 1);
    cEnd = new Date(now.getFullYear(), now.getMonth(), dayOfMonth);
    pStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    pEnd = new Date(now.getFullYear(), now.getMonth() - 1, dayOfMonth);
    titleCur = `هذا الشهر (${dayOfMonth} يوم)`;
    titlePrev = `الشهر الماضي (نفس المدة)`;
  } else if (growthCompareType === 'half') {
    cStart = new Date(now.getFullYear(), now.getMonth() - 5, 1); cEnd = now;
    pStart = new Date(now.getFullYear(), now.getMonth() - 11, 1);
    pEnd = new Date(now.getFullYear(), now.getMonth() - 5, 0);
    titleCur = 'آخر 6 شهور';
    titlePrev = 'الـ 6 السابقة';
  } else {
    const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    cStart = new Date(now.getFullYear(), 0, 1);
    cEnd = new Date(now.getFullYear(), 0, dayOfYear);
    pStart = new Date(now.getFullYear() - 1, 0, 1);
    pEnd = new Date(now.getFullYear() - 1, 0, dayOfYear);
    titleCur = `هذه السنة (${dayOfYear} يوم)`;
    titlePrev = `السنة الماضية (نفس المدة)`;
  }

  const curFrom = cStart.toLocaleDateString('en-GB');
  const curTo = cEnd.toLocaleDateString('en-GB');
  const prevFrom = pStart.toLocaleDateString('en-GB');
  const prevTo = pEnd.toLocaleDateString('en-GB');

  const cur = computeProfitPeriod(curFrom, curTo);
  const prev = computeProfitPeriod(prevFrom, prevTo);

  function pct(c, p) { if (p === 0) return c > 0 ? 100 : 0; return ((c - p) / p) * 100; }

  function growthCard(title, c, p, unit = 'ج') {
    const diff = c - p;
    const pctVal = pct(c, p);
    let icon, color, text;
    if (diff > 0) { icon = 'fa-arrow-up'; color = 'var(--success)'; text = `+${Math.abs(pctVal).toFixed(1)}%`; }
    else if (diff < 0) { icon = 'fa-arrow-down'; color = 'var(--danger)'; text = `-${Math.abs(pctVal).toFixed(1)}%`; }
    else { icon = 'fa-minus'; color = 'var(--text-muted)'; text = 'ثابت'; }
    return `<div style="background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:bold; color:var(--text-muted);">${title}</span>
        <span style="font-size:12px; font-weight:bold; color:${color};"><i class="fas ${icon}"></i> ${text}</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-size:20px; font-weight:900; color:var(--primary);">${fmt(c)} ${unit}</div>
        <div style="font-size:12px; color:var(--text-muted);">السابق: ${fmt(p)} ${unit}</div>
      </div>
    </div>`;
  }

  // حساب الطوايل
  const curTawla = db.production.filter(r => inRange(r.date, curFrom, curTo) && r.type !== 'consumables').reduce((a, b) => a + (+b.tawla || 0), 0);
  const prevTawla = db.production.filter(r => inRange(r.date, prevFrom, prevTo) && r.type !== 'consumables').reduce((a, b) => a + (+b.tawla || 0), 0);

  document.getElementById('repContent').innerHTML = `
    <div class="card">
      <div style="display:flex; gap:8px; margin-bottom:15px; justify-content:center;">
        <button class="btn btn-sm ${growthCompareType === 'month' ? 'btn-primary' : 'btn-secondary'}" onclick="growthCompareType='month'; renderRepGrowth();">شهري</button>
        <button class="btn btn-sm ${growthCompareType === 'half' ? 'btn-primary' : 'btn-secondary'}" onclick="growthCompareType='half'; renderRepGrowth();">نصف سنوي</button>
        <button class="btn btn-sm ${growthCompareType === 'year' ? 'btn-primary' : 'btn-secondary'}" onclick="growthCompareType='year'; renderRepGrowth();">سنوي</button>
      </div>
      <div style="text-align:center; margin-bottom:15px; font-size:13px; color:var(--text-muted);">مقارنة <b>${titleCur}</b> بـ <b>${titlePrev}</b></div>
      ${growthCard('المبيعات', cur.netRevenue, prev.netRevenue)}
      ${growthCard('صافي الربح', cur.netProfit, prev.netProfit)}
      ${growthCard('إجمالي الطوايل', curTawla, prevTawla, 'طاولة')}
      ${growthCard('المصروفات (أجور + أخرى)', cur.payrollExp + cur.otherExp, prev.payrollExp + prev.otherExp)}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
   المطابقة اليومية — فحوصات حقيقية
   ═══════════════════════════════════════════════════════════ */
function renderRepReconciliation() {
  const dayDists = db.distRecords.filter(r => r.date === getViewDate() && r.type !== 'مرتجع');
  const dayProds = db.production.filter(r => r.date === getViewDate() && r.type !== 'consumables');
  const dayOvenReturns = getTodayOvenReturns();

  const totalProductionMoney = dayProds.reduce((a, b) => a + (+b.netMoney || 0), 0);
  const totalDistributedMoney = dayDists.reduce((a, b) => a + (+b.gross || +b.money || 0), 0);
  const availableMoney = totalProductionMoney - totalDistributedMoney + dayOvenReturns;

  const dayTreasury = db.treasury.filter(t => t.date === getViewDate());
  const cashIn = dayTreasury.filter(t => t.type === 'in').reduce((a, b) => a + b.amount, 0);
  const cashOut = dayTreasury.filter(t => t.type === 'out').reduce((a, b) => a + b.amount, 0);

  const todayHandovers = db.handovers.filter(h => h.date === getViewDate());
  const openHandovers = todayHandovers.filter(h => h.paid < h.amount);
  const openHandoversAmount = openHandovers.reduce((a, h) => a + (h.amount - h.paid), 0);

  // 🎯 فحوصات حقيقية
  // 1) هل إجمالي التوزيع = مجموع الأنواع؟
  const standsTotal = dayDists.filter(r => r.type === 'استاند').reduce((a, b) => a + (+b.money || 0), 0);
  const ordersTotal = dayDists.filter(r => r.type === 'أوردر').reduce((a, b) => a + (+b.money || 0), 0);
  const directTotal = dayDists.filter(r => r.type === 'بيع مباشر').reduce((a, b) => a + (+b.money || 0), 0);
  const distsMatch = Math.abs((standsTotal + ordersTotal + directTotal) - totalDistributedMoney) < 0.01;

  // 2) هل العهد المفتوحة = (إجمالي العهد - المحصل)؟
  const totalHandoversAmount = todayHandovers.reduce((a, h) => a + h.amount, 0);
  const totalHandoversPaid = todayHandovers.reduce((a, h) => a + h.paid, 0);
  const expectedOpen = totalHandoversAmount - totalHandoversPaid;
  const handoversMatch = Math.abs(expectedOpen - openHandoversAmount) < 0.01;

  // 3) هل كل إنتاج اليوم اتوزع (أو متبقي إنتاج تام)؟
  const isStockBalanced = Math.abs(availableMoney) < 0.01;
  const isAllCollected = openHandoversAmount <= 0.01;

  const statusIcon = (ok) => ok
    ? '<i class="fas fa-check-circle" style="color:var(--success); font-size:24px;"></i>'
    : '<i class="fas fa-exclamation-circle" style="color:var(--danger); font-size:24px;"></i>';

            <div style="font-size:11px; color:var(--text-muted);">${dayProds.reduce((a,b)=>a+b.tawla,0)} طاولة = ${dayProds.reduce((a,b)=>a+b.netBreads,0)} رغيف</div>
          </div>
          <div style="font-size:20px; font-weight:900; color:var(--accent);">${fmt(totalProductionMoney)} ج</div>
        </div>
      </div>

      <div style="background:var(--bg-alt); padding:14px; border-radius:8px; margin-bottom:12px; border-right:4px solid var(--info);">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <div style="font-weight:900; font-size:15px;">2️⃣ الموزع</div>
          <div style="font-size:18px; font-weight:900; color:var(--info);">${fmt(totalDistributedMoney)} ج</div>
        </div>
        <div style="font-size:12px; color:var(--text-muted);">
          <div>🏪 استاندات: ${fmt(standsTotal)} ج</div>
          <div>📋 أوردرات: ${fmt(ordersTotal)} ج</div>
          <div>💵 بيع مباشر: ${fmt(directTotal)} ج</div>
          ${dayOvenReturns > 0 ? `<div style="color:var(--warning);">🔄 مرتجع فرن: +${fmt(dayOvenReturns)} ج</div>` : ''}
        </div>
      </div>

      <div style="background:${isStockBalanced ? 'var(--success-bg)' : 'var(--warning-bg)'}; padding:14px; border-radius:8px; margin-bottom:12px; border-right:4px solid ${isStockBalanced ? 'var(--success)' : 'var(--warning)'};">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:900; font-size:15px; color:${isStockBalanced ? 'var(--success)' : 'var(--warning)'};">3️⃣ المتاح للتوزيع</div>
            <div style="font-size:11px; color:var(--text-muted);">${isStockBalanced ? 'مطابق' : 'فيه فرق'}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:20px; font-weight:900;">${fmt(availableMoney)} ج</div>
            ${statusIcon(isStockBalanced)}
          </div>
        </div>
      </div>

      <div style="background:var(--bg-alt); padding:14px; border-radius:8px; margin-bottom:12px; border-right:4px solid var(--success);">
        <div style="font-weight:900; font-size:15px; margin-bottom:8px;">4️⃣ الخزنة</div>
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span style="color:var(--success);">📥 داخل: ${fmt(cashIn)} ج</span>
          <span style="color:var(--danger);">📤 خارج: ${fmt(cashOut)} ج</span>
          <span>صافي: <b>${fmt(cashIn - cashOut)} ج</b></span>
        </div>
      </div>

      <div style="background:${isAllCollected ? 'var(--success-bg)' : 'var(--danger-bg)'}; padding:14px; border-radius:8px; margin-bottom:12px; border-right:4px solid ${isAllCollected ? 'var(--success)' : 'var(--danger)'};">
        <div style="display:flex; justify-content:space-between; align-items:center;">

        <div class="summary-row"><span>${statusIcon(handoversMatch)} العهد المفتوحة = إجمالي - مدفوع</span><span>${handoversMatch ? '✅' : '❌'}</span></div>

function renderRepProduction() {
  const batches = db.production.filter(r => inRepRange(r.date) && r.type !== 'consumables');
  const consumables = db.production.filter(r => inRepRange(r.date) && r.type === 'consumables');
  const tawla = batches.reduce((a, b) => a + (+b.tawla || 0), 0);
  const netBreads = batches.reduce((a, b) => a + (+b.netBreads || 0), 0);
  const waste = batches.reduce((a, b) => a + (+b.waste || 0), 0);
  const cost = batches.reduce((a, b) => a + (+b.cost || 0), 0);
  const consCost = consumables.reduce((a, b) => a + (+b.cost || 0), 0);
  const totalFlour = batches.reduce((a, b) => a + (+b.flourUsed || 0), 0);
  // ✅ إصلاح: متوسط التكلفة يشمل المستهلكات
  const avgCostPerBread = netBreads > 0 ? (cost + consCost) / netBreads : 0;

  document.getElementById('repContent').innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">
      <div class="kpi accent" style="padding:12px;"><div class="kpi-label" style="font-size:10px;">الطوايل</div><div class="kpi-value" style="font-size:18px;">${tawla}</div></div>

      <div class="kpi danger" style="padding:12px;"><div class="kpi-label" style="font-size:10px;">الهالك</div><div class="kpi-value" style="font-size:18px;">${fmt(waste)}</div></div>
      <div class="kpi" style="padding:12px;"><div class="kpi-label" style="font-size:10px;">تكلفة الدقيق</div><div class="kpi-value" style="font-size:18px;">${fmt(cost)} ج</div></div>
    </div>
    <div class="card">
      <div class="summary-row"><span>الدقيق المستهلك:</span><b>${fmt(totalFlour)} شيكارة</b></div>
      <div class="summary-row"><span>تكلفة المستهلكات:</span><b>${fmt(consCost)} ج</b></div>
      <div class="summary-row"><span>إجمالي التكلفة:</span><b>${fmt(cost + consCost)} ج</b></div>

}

function renderRepInventory() {
  const items = Object.keys(db.inventory);
  const logs = db.invLog.filter(l => inRepRange(l.date));
  
  // ✅ إضافة: رصيد بداية الفترة = رصيد حالي - صافي حركة الفترة
  const rows = items.map(k => {
    const currentQty = db.inventory[k] || 0;
    const val = currentQty * getInventoryAvgPrice(k);
    const itemLogs = logs.filter(l => l.item === k);
    const inQty = itemLogs.filter(l => l.type === 'in').reduce((a, b) => a + (b.qty || 0), 0);
    const outQty = itemLogs.filter(l => l.type === 'out').reduce((a, b) => a + (b.qty || 0), 0);
    const openQty = currentQty - inQty + outQty;
    return { k, currentQty, val, inQty, outQty, openQty, isLow: currentQty <= (db.minStock[k] || 0) };
  });
  const totalVal = rows.reduce((a, b) => a + b.val, 0);

  document.getElementById('repContent').innerHTML = `
    <div class="card" style="background:var(--primary-); color:#fff; text-align:center; margin-bottom:16px;">
      <div style="font-size:13px; opacity:0.7;">قيمة المخزون</div>
      <div style="font-size:28px; font-weight:900; color:var(--accent);">${fmt(totalVal)} ج</div>
    </div>
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>الصنف</th><th>افتتاحي</th><th>وارد</th><th>صادر</th><th>حالي</th><th>القيمة</th></tr></thead>
        <tbody>${rows.map(r => `<tr style="${r.isLow ? 'background:var(--danger-bg);' : ''}">
          <td><b>${esc(r.k)}</b>${r.isLow ? ' ⚠️' : ''}</td>
          <td style="color:var(--text-muted)">${fmt(r.openQty)}</td>
          <td style="color:var(--success)">+${fmt(r.inQty)}</td>
          <td style="color:var(--danger)">-${fmt(r.outQty)}</td>
          <td><b>${fmt(r.currentQty)}</b></td>
          <td>${fmt(r.val)} ج</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  `;
}

function viewArchivedDay(idx) {
  const d = db.archivedDays[idx];
  if (!d) return;
  const prod = (d.production || []).filter(r => r.type !== 'consumables').reduce((a, b) => a + (+b.netMoney || 0), 0);
  const dist = (d.distRecords || []).reduce((a, b) => a + (+b.money || 0), 0);
  const cashIn = (d.treasury || []).filter(t => t.type === 'in').reduce((a, b) => a + (+b.amount || 0), 0);
  const cashOut = (d.treasury || []).filter(t => t.type === 'out').reduce((a, b) => a + (+b.amount || 0), 0);

  openModal('أرشيف: ' + d.date,
    `<div class="summary-box">
       <div class="summary-row"><span>الإنتاج:</span><b>${fmt(prod)} ج</b></div>
       <div class="summary-row"><span>التوزيع:</span><b>${fmt(dist)} ج</b></div>
       <div class="summary-row"><span>داخل:</span><b style="color:var(--success)">${fmt(cashIn)} ج</b></div>
       <div class="summary-row"><span>خارج:</span><b style="color:var(--danger)">${fmt(cashOut)} ج</b></div>
       <div class="summary-row total"><span>صافي:</span><span>${fmt(cashIn - cashOut)} ج</span></div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>`);
}
</script>

function deleteBatchAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const batch = db.production.find(p => p.id === id);
  if (!batch) return;
  showConfirm('حذف عجنة', `سيتم حذف عجنة <b>${batch.tawla} طاولة</b> نهائيًا وإرجاع الدقيق. متأكد؟`, () => {
    requireAdminPin('حذف عجنة', () => {
      if (batch.flourUsed > 0) {
        const avgPrice = batch.flourUsed > 0 ? (batch.cost / batch.flourUsed) : getInventoryAvgPrice('دقيق');
        addInventory('دقيق', batch.flourUsed, avgPrice);
        db.invLog.push({ id: uid(), date: db.date, type: 'in', item: 'دقيق', qty: batch.flourUsed, desc: 'إرجاع من حذف عجنة', cost: batch.cost || 0 });
      }
      db.production = db.production.filter(p => p.id !== id);
      logAction('حذف عجنة', `${batch.tawla} طاولة`);
      saveDB(); toast('تم الحذف', 'success'); renderEdits();
    });
  }, true);
}

function deleteConsumableAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const c = db.production.find(p => p.id === id);
  if (!c) return;
  showConfirm('حذف مستهلكات', `سيتم حذف <b>${esc(c.item)}</b> نهائيًا وإرجاعها للمخزون.`, () => {
    requireAdminPin('حذف مستهلكات', () => {
      const unitPrice = c.qty > 0 ? (c.cost / c.qty) : getInventoryAvgPrice(c.item);
      addInventory(c.item, c.qty, unitPrice);
      db.invLog.push({ id: uid(), date: db.date, type: 'in', item: c.item, qty: c.qty, desc: 'إرجاع من حذف مستهلكات', cost: c.cost || 0 });
      db.production = db.production.filter(p => p.id !== id);
      logAction('حذف مستهلكات', `${c.item}`);
      saveDB(); toast('تم الحذف', 'success'); renderEdits();
    });
  }, true);
}

function deleteDistAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const r = db.distRecords.find(d => d.id === id);
  if (!r) return;
  showConfirm('حذف توزيع', `سيتم حذف <b>${esc(r.type)} - ${esc(r.name)}</b> نهائيًا.`, () => {
    requireAdminPin('حذف توزيع', () => {
      if (r.type === 'أوردر') {
        const debtAmt = r.debtAmount || 0;
        if (debtAmt > 0) { const c = db.customers.find(x => x.name === r.name); if (c) c.debt = Math.max(0, c.debt - debtAmt); }
        const paidAmt = r.paidAmount || 0;
        if (paidAmt > 0) { db.treasury = db.treasury.filter(t => !(t.date === r.date && t.desc === 'دفعة أوردر: ' + r.name && t.type === 'in')); }
      }
      if (r.type === 'استاند' || r.type === 'بيع مباشر') {
        const h = db.handovers.find(x => x.date === r.date && x.type === r.type && x.name === r.name);
        if (h) { h.amount -= r.money; if (h.amount <= 0.01) db.handovers = db.handovers.filter(x => x.id !== h.id); }
      }
      db.distRecords = db.distRecords.filter(x => x.id !== id);
      logAction('حذف توزيع', r.type + ' - ' + r.name);
      saveDB(); toast('تم الحذف', 'success'); renderEdits();
    });
  }, true);
}

function deleteTreasuryAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const t = db.treasury.find(x => x.id === id);
  if (!t) return;
  showConfirm('حذف حركة خزنة', `سيتم حذف <b>${esc(t.desc)}</b> نهائيًا.`, () => {
    requireAdminPin('حذف من الخزنة', () => {
      const desc = t.desc || '';
      if (desc.startsWith('تحصيل من: ')) {
        const worker = desc.replace('تحصيل من: ', '');
        let remaining = t.amount;
        const paidHandovers = db.handovers.filter(h => h.employee === worker && h.paid > 0.01).sort((a, b) => parseDate(b.date) - parseDate(a.date));
        for (const h of paidHandovers) { if (remaining <= 0.01) break; const take = Math.min(h.paid, remaining); h.paid -= take; remaining -= take; }
      }
      if (desc.startsWith('سداد دين من: ')) {
        const worker = desc.replace('سداد دين من: ', '');
        const paidDebts = db.workerLedger.filter(l => l.worker === worker && l.status === 'paid').sort((a, b) => b.id - a.id);
        if (paidDebts.length > 0) { const d = paidDebts[0]; d.amount = t.amount; d.status = 'unpaid'; }
        else db.workerLedger.push({ id: uid(), date: t.date, worker: worker, type: 'سلفة', amount: t.amount, desc: 'مرتجع من حذف سداد', status: 'unpaid' });
      }
      if (desc.startsWith('تحصيل آجل من ')) { const cust = desc.replace('تحصيل آجل من ', ''); const c = db.customers.find(x => x.name === cust); if (c) c.debt = (+c.debt || 0) + t.amount; }
      if (desc.startsWith('دفعة أوردر: ')) { const cust = desc.replace('دفعة أوردر: ', ''); const c = db.customers.find(x => x.name === cust); if (c) c.debt = (+c.debt || 0) + t.amount; }
      if (desc.startsWith('سداد لـ ')) { const sup = desc.replace('سداد لـ ', ''); const s = db.suppliers.find(x => x.name === sup); if (s) s.debt = (+s.debt || 0) + t.amount; }
      if (desc.startsWith('مصروف: ')) { const expDesc = desc.replace('مصروف: ', ''); db.accRecords = db.accRecords.filter(r => !(r.date === t.date && r.desc === expDesc && r.type === 'expense')); }
      if (desc.startsWith('سلفة: ')) { const worker = desc.replace('سلفة: ', ''); const loan = db.workerLedger.find(l => l.worker === worker && l.type === 'سلفة' && l.amount === t.amount && l.status !== 'paid'); if (loan) db.workerLedger = db.workerLedger.filter(l => l.id !== loan.id); db.accRecords = db.accRecords.filter(r => !(r.date === t.date && r.desc === 'سلفة: ' + worker && r.type === 'expense')); }
      if (desc.startsWith('قبض عامل: ')) { const worker = desc.replace('قبض عامل: ', ''); db.accRecords = db.accRecords.filter(r => !(r.date === t.date && r.desc === 'يومية: ' + worker && r.type === 'expense')); }
      if (desc.startsWith('سداد مستحقات: ')) { const worker = desc.replace('سداد مستحقات: ', ''); db.accRecords = db.accRecords.filter(r => !(r.date === t.date && r.desc === 'يومية: ' + worker && r.type === 'expense')); }
      if (t.category === 'transfer') { const otherDesc = desc.startsWith('تحويل إلى ') ? 'تحويل من ' + desc.replace('تحويل إلى ', '') : 'تحويل إلى ' + desc.replace('تحويل من ', ''); db.treasury = db.treasury.filter(x => !(x.date === t.date && x.amount === t.amount && x.desc === otherDesc && x.category === 'transfer')); }

      db.treasury = db.treasury.filter(x => x.id !== id);
      logAction('حذف من الخزنة', desc);
      saveDB(); toast('تم الحذف', 'success'); updateTopbar(); renderEdits();
    });
  }, true);
}

function deleteWorkerLedgerAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const l = db.workerLedger.find(x => x.id === id);
  if (!l) return;
  showConfirm('حذف قيد عامل', `سيتم حذف <b>${esc(l.type)}</b> لـ <b>${esc(l.worker)}</b> نهائيًا.`, () => {
    requireAdminPin('حذف قيد عامل', () => {
      if (l.type === 'سلفة') {
        const match = db.treasury.find(t => t.date === l.date && t.desc === 'سلفة: ' + l.worker && t.type === 'out' && t.amount === l.amount && t.category === 'loan');
        if (match) db.treasury = db.treasury.filter(t => t.id !== match.id);
      }
      db.workerLedger = db.workerLedger.filter(x => x.id !== id);
      logAction('حذف قيد عامل', `${l.worker} - ${l.type}`);
      saveDB(); toast('تم الحذف', 'success'); updateTopbar(); renderEdits();
    });
  }, true);
}

function deletePurchaseLineAdmin(logId) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const log = db.invLog.find(x => x.id === logId);
  if (!log) return;
  const supName = (log.desc || '').replace('مشتريات من ', '');
  const lineCost = log.cost || 0;
  showConfirm('حذف بند مشتريات', `سيتم حذف <b>${esc(log.item)}</b> نهائيًا وخصمه من المخزن.`, () => {
    requireAdminPin('حذف مشتريات', () => {
      adjustInventoryLayers(log.item, -log.qty, getInventoryAvgPrice(log.item));
      const s = db.suppliers.find(x => x.name === supName);
      if (s) {
        if ((+s.debt || 0) >= lineCost) s.debt -= lineCost;
        else {
          const remaining = lineCost - (+s.debt || 0);
          s.debt = 0;
          const paidTxn = db.treasury.find(t => t.date === log.date && t.desc === 'مشتريات من ' + supName && t.category === 'purchase' && t.type === 'out');
          if (paidTxn) { if (paidTxn.amount >= remaining) { paidTxn.amount -= remaining; if (paidTxn.amount <= 0.01) db.treasury = db.treasury.filter(t => t.id !== paidTxn.id); } else db.treasury = db.treasury.filter(t => t.id !== paidTxn.id); }
        }
      }
      db.invLog = db.invLog.filter(x => x.id !== logId);
      logAction('حذف بند مشتريات', `${supName} - ${log.item}`);
      saveDB(); toast('تم الحذف', 'success'); renderEdits();
    });
  }, true);
}

function deleteExpenseAdmin(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const r = db.accRecords.find(x => x.id === id);
  if (!r) return;
  showConfirm('حذف مصروف', `سيتم حذف <b>${esc(r.desc)}</b> نهائيًا وإرجاع المبلغ للخزنة.`, () => {
    requireAdminPin('حذف مصروف', () => {
      const txn = db.treasury.find(t => t.date === r.date && t.desc === 'مصروف: ' + r.desc && t.category === 'expense' && t.amount === r.amount);
      if (txn) db.treasury = db.treasury.filter(t => t.id !== txn.id);
      db.accRecords = db.accRecords.filter(x => x.id !== id);
      logAction('حذف مصروف', r.desc);
      saveDB(); toast('تم الحذف', 'success'); updateTopbar(); renderEdits();
    });
  }, true);
}
  function renderUsers() {
  document.getElementById('content').innerHTML = `
    <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="nav('admin')"><i class="fas fa-arrow-right"></i> رجوع</button>
    
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fas fa-user-plus"></i> إضافة مستخدم</div></div>
      <div class="form-row">
        <div class="form-group"><label>الاسم</label><input type="text" id="nuName" class="form-control"></div>
        <div class="form-group"><label>PIN</label><input type="password" id="nuPin" class="form-control pin-input" maxlength="6"></div>
      </div>
      <div class="form-group"><label>الصلاحية</label>
        <select id="nuRole" class="form-control">
          ${db.roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-accent btn-block" onclick="addUser()">إضافة</button>
    </div>

    <div class="card">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div class="card-title"><i class="fas fa-users"></i> المستخدمين الحاليين</div>
        <button class="btn btn-sm btn-info" onclick="openManageRolesModal()"><i class="fas fa-cogs"></i> إدارة الوظائف</button>
      </div>
      
      ${db.users.map((u, i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid var(--border);">
          <div><b>${esc(u.name)}</b> <span class="pill pill-info" style="font-size:10px;">${getRoleName(u.role)}</span></div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm btn-info" onclick="openUserPermissionsModal(${i})"><i class="fas fa-shield-alt"></i></button>
            <button class="btn btn-sm btn-warning" onclick="openChangePinModal(${i})"><i class="fas fa-key"></i></button>
            ${u.name !== currentUser.name ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${i})"><i class="fas fa-trash"></i></button>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function getRoleName(roleId) {
  if (!db.roles) db.roles = [];
  const role = db.roles.find(r => r.id === roleId);
  return role ? role.name : roleId;
}

function openManageRolesModal() {
  const list = db.roles.map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--border);">
      <b>${esc(r.name)}</b>
      ${(r.id !== 'admin' && r.id !== 'accountant' && r.id !== 'production' && r.id !== 'distribution') 
        ? `<button class="btn btn-sm btn-danger" onclick="deleteRole('${r.id}')"><i class="fas fa-trash"></i></button>` 
        : '<span class="pill pill-primary" style="font-size:9px;">أساسي</span>'}
    </div>
  `).join('');

  openModal('إدارة الوظائف',
    `<div style="max-height:200px; overflow-y:auto; margin-bottom:16px;">${list}</div>
     <div class="form-group" style="background:var(--bg-alt); padding:12px; border-radius:8px;">
       <label style="color:var(--primary); font-weight:900;">إضافة وظيفة جديدة</label>
       <div style="display:flex; gap:8px; margin-top:8px;">
         <input type="text" id="newRoleName" class="form-control" placeholder="اسم الوظيفة (مثال: كاشير)">
         <button class="btn btn-success" onclick="addNewRole()">إضافة</button>
       </div>
     </div>`,
    `<button class="btn btn-secondary btn-block" onclick="closeModal()">إغلاق</button>`
  );
}

function addNewRole() {
  const name = getStr('newRoleName');
  if (!name) return toast('أدخل اسم الوظيفة', 'error');
  
  const id = 'role_' + Date.now();
  db.roles.push({ id, name });
  saveDB();
  toast('تمت إضافة الوظيفة بنجاح', 'success');
  closeModal();
  renderUsers(); 
}

function deleteRole(roleId) {
  showConfirm('حذف وظيفة', 'هل أنت متأكد؟ لن يتم حذف المستخدمين لكن سيتم إلغاء وظيفتهم.', () => {
    db.roles = db.roles.filter(r => r.id !== roleId);
    saveDB();
    toast('تم الحذف', 'success');
    renderUsers();
  });
}
</script>
