    return deepMerge(JSON.parse(JSON.stringify(defaultDB)), JSON.parse(jsonStr));
  } catch (e) {

}

async function saveDB() {
  try {
    const jsonStr = JSON.stringify(db);
    let toStore = jsonStr;
    if (typeof LZString !== 'undefined') {
      const compressed = LZString.compressToUTF16(jsonStr);
      if (compressed && compressed.length < jsonStr.length) toStore = compressed;
    }
    localStorage.setItem(DB_KEY, toStore);

    if (_supabase) {
      setSyncStatus('syncing');
      const { error } = await _supabase.from('app_state').upsert({ id: 1, data: db, updated_at: new Date() });
      if (error) {
        setSyncStatus('error');
        console.error('Sync error:', error);
      } else {
        setSyncStatus('synced');
      }
    } else {
      setSyncStatus('offline');
    }
  } catch (e) {
    setSyncStatus('error');
    console.error('saveDB error:', e);
  }
}

function deepMerge(base, over) {
  const result = JSON.parse(JSON.stringify(base));
  if (!over || typeof over !== 'object') return result;
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])
        && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      result[k] = deepMerge(base[k], over[k]);
    } else {
      result[k] = over[k];
    }
  }
  return result;
}

function runMigrations() {
  if (!db) return;

  if ((db.version || 0) < 18.0) {
    if (!Array.isArray(db.handoverLines)) db.handoverLines = [];
    if (!Array.isArray(db.workerOpeningReceivables)) db.workerOpeningReceivables = [];
    if (!db.opening) db.opening = { done: false, date: today(), treasury: { cash: 0, vodafone: 0 } };
    if (!db.opening.workerReceivables) db.opening.workerReceivables = {};
    const existingLineIds = new Set(db.handoverLines.map(l => l.handoverId));
    db.handovers.forEach(h => {
      if (!existingLineIds.has(h.id)) {
        db.handoverLines.push({
          id: uid(), handoverId: h.id, date: h.date, type: h.type,
          name: h.name, employee: h.employee, amount: h.amount,

          desc: h.type === 'استاند' ? `عهدة أصلية - ${h.name}` : `عهدة أصلية - ${h.type}`,
          createdAt: h.date
        });
      }
    });
    db.version = 18.0;
  }

  if ((db.version || 0) < 18.1) {
    if (!db.settings) db.settings = {};
    if (typeof db.settings.defaultGasPrice === 'undefined') db.settings.defaultGasPrice = 0;
    if (typeof db.settings.defaultYeastPrice === 'undefined') db.settings.defaultYeastPrice = 0;
    if (typeof db.settings.defaultBagsPrice === 'undefined') db.settings.defaultBagsPrice = 0;
    db.version = 18.1;
  }

  db.viewDate = db.date || today();
  saveDB();
}

  // باقي الرتب (افتراضياً بياخدوا نفس صلاحيات العرض بتاعتهم)

    closeConfirmModal();

    actualCloseModal();

      if (renderers.reports) renderers.reports();
      ensureBackupState();
      return;

  // 4) شاشة فرعية؟

let lockUntil = 0;
function openLogin() {
  const sel = $('loginUser');
  if (!sel) return;
  if (!db || !db.users || db.users.length === 0) {
    toast('لا يوجد مستخدمين — أعد تحميل الصفحة', 'error');
    return;
  }
  
  // تفريغ الخانة
  sel.value = '';
  $('loginPin').value = '';

  // استرجاع "تذكرني"
  const savedUser = localStorage.getItem(REMEMBER_KEY);
  if (savedUser) {
    sel.value = savedUser;
    const rememberCb = $('loginRemember');
    if (rememberCb) rememberCb.checked = true;
  }

  $('loginScreen').classList.remove('hidden');
  setTimeout(() => { const p = $('loginPin'); if (p) p.focus(); }, 100);

function doLogin() {
  if (Date.now() < lockUntil) {
    const mins = Math.ceil((lockUntil - Date.now()) / 60000);
    return toast(`مقفول — حاول بعد ${mins} دقيقة`, 'error');
  }
  const name = $('loginUser').value.trim();
  const pin = $('loginPin').value.trim();
  const user = db.users.find(u => u.name === name);

  if (!user || user.pin !== hashPin(pin)) {
    loginAttempts++;
    if (loginAttempts >= 5) {
      lockUntil = Date.now() + 15 * 60000;
      loginAttempts = 0;
      return toast('تم القفل 15 دقيقة', 'error');
    }
    return toast(`PIN خطأ (${loginAttempts}/5)`, 'error');
  }

  loginAttempts = 0;
  currentUser = user;
  sessionStorage.setItem(SESSION_KEY, user.name);

  // 🆕 حفظ "تذكرني" في localStorage
  const rememberCb = $('loginRemember');
  if (rememberCb && rememberCb.checked) {
    localStorage.setItem(REMEMBER_KEY, user.name);
  } else {
    localStorage.removeItem(REMEMBER_KEY);
  }

  if (user.role === 'admin' && pin === '1234') {
    return forceChangePin(user);
  }
  enterApp();
}

function forceChangePin(user) {
  openModal('🔐 تغيير PIN إجباري',
    `<div class="danger-banner" style="margin-bottom:16px;">
       <i class="fas fa-exclamation-triangle"></i> أنت تستخدم PIN افتراضي (1234). يجب تغييره للحماية.
     </div>
     <div class="form-group">
       <label>PIN الجديد (4 أرقام على الأقل)</label>
       <input type="password" id="forceNewPin" class="form-control pin-input" maxlength="6" inputmode="numeric">
     </div>
     <div class="form-group">
       <label>تأكيد PIN الجديد</label>
       <input type="password" id="forceConfirmPin" class="form-control pin-input" maxlength="6" inputmode="numeric">
     </div>`,
    `<button class="btn btn-accent" onclick="saveForcePin('${esc(user.name)}')">حفظ ودخول</button>`
  );
  $('modal').classList.add('mandatory');
  const closeBtn = document.querySelector('#modal .modal-close');
  if (closeBtn) closeBtn.style.display = 'none';
  setTimeout(() => { const p = $('forceNewPin'); if (p) p.focus(); }, 200);
}

function saveForcePin(userName) {
  const newPin = $('forceNewPin').value;
  const confirmPin = $('forceConfirmPin').value;
  if (newPin.length < 4) return toast('PIN يجب أن يكون 4 أرقام على الأقل', 'error');
  if (newPin !== confirmPin) return toast('PIN غير متطابق', 'error');

  const admin = db.users.find(u => u.name === userName && u.role === 'admin');
  if (!admin) return toast('المستخدم غير موجود', 'error');

  admin.pin = hashPin(newPin);
  saveDB();

  $('modal').classList.remove('active', 'mandatory');
  const closeBtn = document.querySelector('#modal .modal-close');
  if (closeBtn) closeBtn.style.display = '';

  currentUser = admin;
  sessionStorage.setItem(SESSION_KEY, admin.name);
  toast('تم تغيير PIN بنجاح', 'success');
  setTimeout(() => enterApp(), 300);
}

function enterApp() {
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('sidebarBrand').textContent = db.settings.storeName;
  $('loginBrand').textContent = db.settings.storeName;
  $('topbarTitle').textContent = db.settings.storeName;
  $('sidebarUser').textContent = currentUser.name + ' — ' + [currentUser.role];

  // 🆕 اسم المستخدم في الهيدر
  const topbarUser = $('topbarUser');
  if (topbarUser) {
    topbarUser.textContent = currentUser.name;
    topbarUser.style.display = window.innerWidth >= 600 ? 'block' : 'none';
  }

  applyPermissions();
  applyTheme();
  updateTopbar();

  isExiting = false;
  currentSection = 'dashboard';
  currentSubScreen = null;

  nav(canView('dashboard') ? 'dashboard' : allSections.find(s => canView(s)) || 'admin');

  setTimeout(() => ensureBackupState(), 100);
}

function logout() {
  showConfirm('تسجيل الخروج', 'هل أنت متأكد من تسجيل الخروج؟', () => {
    currentUser = null;
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(REMEMBER_KEY);
    $('app').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    currentSection = 'dashboard';
    currentSubScreen = null;
    openLogin();
  });
}

function nav(section) {
  if (!currentUser) return;
  if (!canView(section)) { toast('غير مصرح لك', 'error'); return; }

  applyPermissions();
  currentSection = section;
  if (!canEdit(section)) {
  document.body.classList.add('read-only-mode');
} else {
  document.body.classList.remove('read-only-mode');
}
  currentSubScreen = null;

  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.section === section));
  updateBottomNav(section);

  $('content').innerHTML = `<div style="text-align:center; padding:60px 20px;"><i class="fas fa-spinner fa-spin" style="font-size:36px; color:var(--primary);"></i></div>`;

  setTimeout(() => {
    try {
      if (renderers[section]) renderers[section]();
      else renderPlaceholder(section);
    } catch (e) {
      console.error('nav error:', e);
      $('content').innerHTML = `<div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        <div class="empty-state-title">حدث خطأ</div>
        <div class="empty-state-text">${esc(e.message)}</div>
      </div>`;
    }
  }, 80);

  if (window.innerWidth < 1024) toggleSidebar(true);
}

function updateBottomNav(section) {
  $$('.bottom-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === section);
  });
}

function renderPlaceholder(section) {
  $('content').innerHTML = `
    <div class="page-header">
      <div class="page-title">
        <i class="fas fa-circle"></i>
        <div class="page-title-text"><span class="page-title-main">${sectionNames[section] || section}</span></div>
      </div>
    </div>
    <div class="card">
      <div class="empty-state">
        <i class="fas fa-tools"></i>
        <div class="empty-state-title">قسم ${sectionNames[section] || section}</div>
        <div class="empty-state-text">قريباً...</div>
      </div>
    </div>`;
}

function updateTopbar() {
  const dateEl = $('topbarDate');
  if (dateEl && db) dateEl.textContent = (db.date || '') + (db.isRestDay ? ' — يوم راحة' : '');
}

function openNotifPanel() {
  nav('notifications');
}

window.onerror = function(msg, url, line, col, error) {
  alert("يا معلم فيه خطأ في الكود:\n" + msg + "\nفي السطر رقم: " + line);
  return false;
};

window.addEventListener('load', async () => {
  setTimeout(async () => {
    try {
      db = await loadDB();
      // المزامنة اللحظية بين الموبايلات (Realtime)
if (_supabase) {
  _supabase.channel('custom-all-channel')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' }, payload => {
      if (payload.new && payload.new.data) {
        const incomingData = payload.new.data;
        // تحديث الداتا المحلية
        db = deepMerge(JSON.parse(JSON.stringify(defaultDB)), incomingData);
        if (currentUser) {
          if (renderers[currentSection]) renderers[currentSection]();
          toast('تم مزامنة بيانات جديدة من جهاز آخر', 'info');
        }
      }
    })
    .subscribe();
}
      runMigrations();

      const splashTitle = $('splashTitle');
      const loginBrand = $('loginBrand');
      if (splashTitle) splashTitle.textContent = db.settings.storeName;
      if (loginBrand) loginBrand.textContent = db.settings.storeName;

      const splash = $('splash');
      if (splash) splash.style.opacity = '0';

      setTimeout(() => {
        if (splash) splash.classList.add('hidden');
        const sessionUser = sessionStorage.getItem(SESSION_KEY);
        const rememberUser = localStorage.getItem(REMEMBER_KEY);
        const candidateName = sessionUser || rememberUser;
        const user = candidateName ? db.users.find(u => u.name === candidateName) : null;
        if (user) { currentUser = user; enterApp(); }
        else { openLogin(); }
      }, 400);

    } catch (error) {
      alert("حدث خطأ أثناء التشغيل: " + error.message);
      console.error(error);
    }
  }, 1500);
});
</script>

<script>
if (!window.__waStore) window.__waStore = {};

function shareWhatsAppText(text) {
  if (!text) return;
  try {
    const encoded = encodeURIComponent(text);
    const url = 'https://api.whatsapp.com/send?text=' + encoded;
    const win = window.open(url, '_blank');
    if (!win) window.location.href = url;
  } catch (e) {
    toast('حدث خطأ في المشاركة', 'error');
  }
}

function registerWaText(text) {
  const id = 'wa_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
  window.__waStore[id] = text;
  setTimeout(() => { delete window.__waStore[id]; }, 3600000);
  return id;
}

function doShareWa(id) {
  const text = window.__waStore[id];
  if (!text) return toast('انتهت صلاحية النص، أعد فتح الشاشة', 'warning');
  shareWhatsAppText(text);
}

function waBtn(text, label = 'واتساب', className = 'btn btn-success') {
  const id = registerWaText(text);
  return `<button class="${className}" onclick="doShareWa('${id}')"><i class="fab fa-whatsapp"></i> ${esc(label)}</button>`;
}

let __modalBackupFooter = null;
let __modalPendingSave = null;

function openModal(title, bodyHTML, footerHTML) {
  const titleEl = document.getElementById('modalTitle');
  const bodyEl = document.getElementById('modalBody');
  const footerEl = document.getElementById('modalFooter');
  const modalEl = document.getElementById('modal');
  if (!titleEl || !bodyEl || !footerEl || !modalEl) {
    console.error('Modal elements missing!');
    return;
  }
  titleEl.textContent = title;
  bodyEl.innerHTML = bodyHTML;
  footerEl.innerHTML = footerHTML || '';
  __modalBackupFooter = null;
  __modalPendingSave = null;
  modalEl.classList.add('active');
  ensureBackupState();
}

function closeModal() {
  actualCloseModal();
  ensureBackupState();
}

function actualCloseModal() {
  const modalEl = document.getElementById('modal');
  if (modalEl) {
    modalEl.classList.remove('active', 'mandatory');
    const closeBtn = modalEl.querySelector('.modal-close');
    if (closeBtn) closeBtn.style.display = '';
  }
  __modalBackupFooter = null;
  __modalPendingSave = null;
}

function showConfirm(title, msg, onConfirm, danger = false) {
  openModal(title,
    `<p style="text-align:center; font-size:15px; font-weight:700; line-height:1.8;">${msg}</p>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn ${danger ? 'btn-danger' : 'btn-accent'}" id="confirmBtn">تأكيد</button>`
  );
  const btn = document.getElementById('confirmBtn');
  if (btn) btn.onclick = () => { closeModal(); onConfirm(); };
}

function requireSaveConfirm(options) {
  if (currentSection && !canEdit(currentSection)) {
  return toast('عذراً، لا تمتلك صلاحية للتعديل في هذا القسم', 'error');
}
  const { summary, onConfirm } = options;
  let confirmEl = document.getElementById('confirmModal');
  if (!confirmEl) {
    confirmEl = document.createElement('div');
    confirmEl.id = 'confirmModal';
    confirmEl.className = 'modal';
    confirmEl.style.zIndex = '11000';
    document.body.appendChild(confirmEl);
  }
  confirmEl.innerHTML = `
    <div class="modal-content" style="max-width:480px;">
      <div class="modal-header">
        <h3><i class="fas fa-question-circle" style="color:var(--warning);"></i> تأكيد الحفظ</h3>
        <button class="modal-close" onclick="closeConfirmModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div style="background:var(--bg-alt); padding:14px; border-radius:8px; line-height:1.9; font-size:13px; color:var(--text);">${summary}</div>
      </div>
      <div class="modal-footer" style="justify-content:stretch; gap:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeConfirmModal()">
          <i class="fas fa-times"></i> إلغاء
        </button>
        <button class="btn btn-success" style="flex:1;" onclick="__confirmPendingSave()">
          <i class="fas fa-check"></i> تأكيد الحفظ
        </button>
      </div>
    </div>
  `;
  window.__confirmSaveCallback = onConfirm;
  confirmEl.classList.add('active');
  ensureBackupState();
}

function closeConfirmModal() {
  const el = document.getElementById('confirmModal');
  if (el) el.classList.remove('active');
  window.__confirmSaveCallback = null;
}

function __confirmPendingSave() {
  const cb = window.__confirmSaveCallback;
  closeConfirmModal();
  if (typeof cb === 'function') cb();
}

function cancelInlineSave() { closeConfirmModal(); }
function confirmInlineSave() { __confirmPendingSave(); }

function requireAdminPin(actionTitle, onSuccess) {
  if (currentUser && currentUser.role === 'admin') {
    // حتى لو مدير — لو العملية حساسة جداً، يفضل يطلب PIN
    return onSuccess();
  }
  openModal('تأكيد المدير',
    `<p style="text-align:center; margin-bottom:16px; font-weight:700;">العملية: <b>${esc(actionTitle)}</b></p>
     <div class="form-group">
       <label><i class="fas fa-lock"></i> PIN المدير</label>
       <input type="password" id="adminPinInput" class="form-control pin-input" maxlength="6" inputmode="numeric">
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-accent" id="pinConfirmBtn">تأكيد</button>`
  );
  setTimeout(() => { const p = document.getElementById('adminPinInput'); if (p) p.focus(); }, 100);
  const btn = document.getElementById('pinConfirmBtn');
  if (btn) btn.onclick = () => {
    const pin = document.getElementById('adminPinInput').value;
    if (!db.users.find(u => u.role === 'admin' && u.pin === hashPin(pin))) {
      return toast('PIN خطأ', 'error');
    }
    closeModal();
    logAction('تأكيد مدير', actionTitle);
    onSuccess();
  };
}

function logAction(action, details = '') {
  if (!db.auditLog) db.auditLog = [];
  db.auditLog.push({
    id: uid(),
    date: db.date,
    time: new Date().toLocaleTimeString('en-GB'),
    user: currentUser ? currentUser.name : 'نظام',
    action: action,
    details: String(details || '')
  });
  if (db.auditLog.length > 1000) db.auditLog.shift();
}

function num(id, fallback = 0) {
  const el = document.getElementById(id);
  if (!el) return fallback;
  const v = parseFloat(String(el.value).replace(/[^\d.-]/g, ''));
  return isNaN(v) ? fallback : v;
}

function getVal(id, fallback = 0) { return num(id, fallback); }

function getStr(id, fallback = '') {
  const el = document.getElementById(id);
  return el ? String(el.value).trim() : fallback;
}

function blockInt(el) {
  el.value = el.value.replace(/[^0-9]/g, '');
}

function blockDec(el) {
  let v = el.value.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  el.value = v;
}

function parseDate(dateStr) {
  if (!dateStr) return 0;
  const p = String(dateStr).split('/');
  if (p.length !== 3) return 0;
  return new Date(+p[2], +p[1] - 1, +p[0]).getTime();
}

function inRange(dateStr, fromStr, toStr) {
  const t = parseDate(dateStr);
  if (!t) return false;
  const from = parseDate(fromStr) || 0;
  const to = (parseDate(toStr) || Date.now()) + 86399999;
  return t >= from && t <= to;
}

function setBtnLoading(btn, loading = true) {
  if (!btn) return;
  if (loading) {
    btn.classList.add('loading');
    btn.disabled = true;
  } else {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
</script>
 
<script>
function getInventoryQty(item) {
  return db.inventory[item] || 0;
}

function checkInventory(item, qty) {
  return getInventoryQty(item) >= qty - 0.001;
}

function defaultPrice(item) {
  if (item === 'غاز') return db.settings.defaultGasPrice || 0;
  if (item === 'خميرة') return db.settings.defaultYeastPrice || 0;
  if (item === 'أكياس') return db.settings.defaultBagsPrice || 0;
  return 0;
}

function deductInventory(item, qty) {
  if (qty <= 0) return 0;
  if (!db.invLayers[item]) db.invLayers[item] = [];
  const layers = db.invLayers[item];
  let remaining = qty;
  let cost = 0;
  for (let i = 0; i < layers.length && remaining > 0.001; i++) {
    if (layers[i].qty > 0) {
      const take = Math.min(layers[i].qty, remaining);
      const price = layers[i].price > 0 ? layers[i].price : defaultPrice(item);
      layers[i].qty -= take;
      remaining -= take;
      cost += take * price;
    }
  }
  if (remaining > 0.001) cost += remaining * defaultPrice(item);
  db.invLayers[item] = layers.filter(l => l.qty > 0.001);
  db.inventory[item] = Math.max(0, (db.inventory[item] || 0) - qty);
  db.invLog.push({ id: uid(), date: db.date, type: 'out', item, qty, desc: 'استهلاك', cost });
  return cost;
}

function addInventory(item, qty, pricePerUnit) {
  if (qty <= 0) return;
  db.inventory[item] = (db.inventory[item] || 0) + qty;
  if (!db.invLayers[item]) db.invLayers[item] = [];
  db.invLayers[item].push({ qty, price: Math.max(0, +pricePerUnit || 0) });
}

function getInventoryAvgPrice(item) {
  const layers = db.invLayers[item] || [];
  const totalQty = layers.reduce((a, l) => a + l.qty, 0);
  if (totalQty === 0) return defaultPrice(item);
  return layers.reduce((a, l) => a + (l.qty * l.price), 0) / totalQty;
}

function adjustInventoryLayers(item, diff, price) {
  if (Math.abs(diff) < 0.001) return 0;
  if (diff > 0) {
    if (!db.invLayers[item]) db.invLayers[item] = [];
    const p = price || defaultPrice(item) || getInventoryAvgPrice(item);
    db.invLayers[item].push({ qty: diff, price: p });
    db.inventory[item] = (db.inventory[item] || 0) + diff;
    return 0;
  } else {
    const qty = Math.abs(diff);
    const layers = db.invLayers[item] || [];
    let remaining = qty;
    let cost = 0;
    for (let i = 0; i < layers.length && remaining > 0.001; i++) {
      if (layers[i].qty > 0) {
        const take = Math.min(layers[i].qty, remaining);
        const p = layers[i].price > 0 ? layers[i].price : defaultPrice(item);
        layers[i].qty -= take;
        remaining -= take;
        cost += take * p;
      }
    }
    db.invLayers[item] = layers.filter(l => l.qty > 0.001);
    db.inventory[item] = Math.max(0, (db.inventory[item] || 0) - qty);
    return cost;
  }
}

function getViewDate() {
  return (db && db.viewDate) || (db && db.date) || today();
}

function getCashBalance() {
  return db.treasury.reduce((a, r) => a + (r.type === 'in' ? +r.amount : -r.amount), 0);
}

function getCashBalanceByMethod(method) {
  return db.treasury
    .filter(r => (r.method === method || (!r.method && method === 'cash')))
    .reduce((a, r) => a + (r.type === 'in' ? +r.amount : -r.amount), 0);
}

function getTodayNetProduction() {
  return db.production
    .filter(r => r.date === getViewDate() && r.type !== 'consumables')
    .reduce((a, b) => a + (+b.netMoney || 0), 0);
}

function getTodayProductionCost() {
  return db.production
    .filter(r => r.date === getViewDate())
    .reduce((a, b) => a + (+b.cost || 0), 0);
}

function getTodayTawla() {
  return db.production
    .filter(r => r.date === getViewDate() && r.type !== 'consumables')
    .reduce((a, b) => a + (+b.tawla || 0), 0);
}

function getTodayWaste() {
  return db.production
    .filter(r => r.date === getViewDate() && r.type !== 'consumables')
    .reduce((a, b) => a + (+b.waste || 0), 0);
}

function getTodayGrossDistributed() {
  return db.distRecords
    .filter(r => r.date === getViewDate() && r.type !== 'مرتجع')
    .reduce((a, b) => a + (+b.gross || +b.money || 0), 0);
}

function getTodayRevenue() {
  return db.distRecords
    .filter(r => r.date === getViewDate() && r.type !== 'مرتجع')
    .reduce((a, b) => a + (+b.money || 0), 0);
}

function getTodayDiscounts() {
  return getTodayGrossDistributed() - getTodayRevenue();
}

function getTodayOvenReturns() {
  return (db.returns || [])
    .filter(r => r.date === getViewDate() && r.type === 'مرتجع للفرن')
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getAvailableToDistribute() {
  const v = getTodayNetProduction() - getTodayGrossDistributed() + getTodayOvenReturns();
  return v > 0 ? v : 0;
}

function getTodayCollected() {
  return db.treasury
    .filter(r => r.date === getViewDate() && r.type === 'in' && (r.category === 'collection' || r.category === 'order_payment'))
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getTodayHandoversRemaining() {
  return db.handovers
    .filter(h => h.date === getViewDate() && h.paid < h.amount)
    .reduce((a, b) => a + (b.amount - b.paid), 0);
}

function getTodayEatingBread() {
  return db.eatingBread
    .filter(e => e.date === getViewDate())
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getTodayReturnsLoss() {
  return db.returns
    .filter(r => r.date === getViewDate() && r.type === 'هالك')
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getTodayExpenses() {
  return db.accRecords
    .filter(r => r.date === getViewDate() && r.type === 'expense')
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getTodayOperatingProfit() {
  return getTodayRevenue()
    - getTodayProductionCost()
    - getTodayExpenses()
    - getTodayEatingBread()
    - getTodayReturnsLoss();
}

function getAllOpenHandovers() {
  return db.handovers.filter(h =>
    h.paid < h.amount &&
    (h.type === 'استاند' || h.type === 'بيع مباشر')
  );
}

function getAllCustomersDebt() {
  return db.customers.reduce((a, c) => a + (+c.debt || 0), 0);
}

function getAllWorkersDebt() {
  return db.workerLedger
    .filter(l => l.status !== 'paid' && (+l.amount || 0) > 0)
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getAllWorkersReceivable() {
  let total = 0;
  total += (db.workerOpeningReceivables || [])
    .filter(r => r.status !== 'paid' && (+r.amount || 0) > 0)
    .reduce((a, b) => a + (+b.amount || 0), 0);
  db.workers.forEach(w => {
    const atts = db.attendance.filter(a => a.worker === w.name);
    atts.forEach(a => {
      const isPaid = db.accRecords.some(r =>
        r.date === a.date &&
        r.desc === 'يومية: ' + w.name &&
        r.type === 'expense'
      );
      if (!isPaid) total += (w.daily * (a.ratio || 1));
    });
  });
  return total;
}

function getWorkerReceivable(workerName) {
  let total = 0;
  total += (db.workerOpeningReceivables || [])
    .filter(r => r.worker === workerName && r.status !== 'paid')
    .reduce((a, b) => a + (+b.amount || 0), 0);
  const w = db.workers.find(x => x.name === workerName);
  if (w) {
    const atts = db.attendance.filter(a => a.worker === workerName);
    atts.forEach(a => {
      const isPaid = db.accRecords.some(r =>
        r.date === a.date &&
        r.desc === 'يومية: ' + workerName &&
        r.type === 'expense'
      );
      if (!isPaid) total += (w.daily * (a.ratio || 1));
    });
  }
  return total;
}

function getWorkerDebts(workerName) {
  return db.workerLedger
    .filter(l => l.worker === workerName && l.status !== 'paid' && (+l.amount || 0) > 0)
    .reduce((a, b) => a + (+b.amount || 0), 0);
}

function getAllSuppliersDebt() {
  return db.suppliers.reduce((a, s) => a + (+s.debt || 0), 0);
}

function getTotalReceivable() {
  return getTodayHandoversRemaining()
    + getAllCustomersDebt()
    + getAllWorkersDebt();
}

function getTotalPayable() {
  return getAllSuppliersDebt() + getAllWorkersReceivable();
}

function getAllDebtsSummary() {
  return {
    todayHandovers: getTodayHandoversRemaining(),
    customersDebt: getAllCustomersDebt(),
    workersDebt: getAllWorkersDebt(),
    workersReceivable: getAllWorkersReceivable(),
    suppliersDebt: getAllSuppliersDebt(),
    total: getTodayHandoversRemaining() + getAllCustomersDebt() + getAllWorkersDebt() + getAllSuppliersDebt()
  };
}

/* ═══════════════════════════════════════════════════════════
   إنتاج تام غير موزع (Finished Goods Inventory) 🆕
   
   المشكلة القديمة: إنتاج اليوم اللي مش اتوزع مكانش بيتحسب كأصل
   الحل: بنحسب قيمة الإنتاج التام المتبقي + المخزون المواد الخام
   ═══════════════════════════════════════════════════════════ */
function getFinishedGoodsValue() {
  let total = 0;
  // نجمع كل الأيام اللي فيها إنتاج غير موزع
  const allDates = new Set();
  db.production.forEach(p => { if (p.date) allDates.add(p.date); });

  allDates.forEach(d => {
    const netProd = db.production
      .filter(p => p.date === d && p.type !== 'consumables')
      .reduce((a, b) => a + (+b.netMoney || 0), 0);
    const grossDist = db.distRecords
      .filter(r => r.date === d && r.type !== 'مرتجع')
      .reduce((a, b) => a + (+b.gross || +b.money || 0), 0);
    const ovenRet = (db.returns || [])
      .filter(r => r.date === d && r.type === 'مرتجع للفرن')
      .reduce((a, b) => a + (+b.amount || 0), 0);
    const remaining = Math.max(0, netProd - grossDist + ovenRet);
    total += remaining;
  });

  return total;
}

/* ═══════════════════════════════════════════════════════════
   المركز المالي الحالي (v18.1 — معدّل)
   
   الأصول:
   - خزنة (كاش + فودافون)
   - مخزون المواد الخام
   - إنتاج تام غير موزع 🆕
   - ديون عملاء
   - ديون عمال
   - عهد مفتوحة
   
   الالتزامات:
   - ديون موردين
   - مستحقات عمال
   ═══════════════════════════════════════════════════════════ */
function getCurrentFinancialPosition() {
  const cash = getCashBalanceByMethod('cash');
  const voda = getCashBalanceByMethod('vodafone');
  let invValue = 0;
  Object.keys(db.inventory).forEach(k => { invValue += (db.inventory[k] || 0) * getInventoryAvgPrice(k); });

  const finishedGoods = getFinishedGoodsValue();
  const custDebt = getAllCustomersDebt();
  const workersDebt = getAllWorkersDebt();
  const suppDebt = getAllSuppliersDebt();
  const workersReceivable = getAllWorkersReceivable();
  const handovers = getAllOpenHandovers().reduce((a, h) => a + (h.amount - h.paid), 0);

  const assets = cash + voda + invValue + finishedGoods + custDebt + workersDebt + handovers;
  const liabilities = suppDebt + workersReceivable;

  return {
    date: today(),
    cash, vodafone: voda,
    invValue,
    finishedGoods,
    customersDebt: custDebt,
    workersDebt,
    workersReceivable,
    handoversOpen: handovers,
    suppliersDebt: suppDebt,
    assets, liabilities,
    net: assets - liabilities
  };
}

/* ═══════════════════════════════════════════════════════════
   المركز المالي في تاريخ معين (v18.1 — إصلاح جذري)
   
   المشكلة القديمة: كان بيحسب من الحالة الحالية = أرقام غلط
   الحل: 
   - لو التاريخ = النهاردة → live position
   - غير كده → snapshot محفوظ
   - لو مفيش snapshot → null (التقرير يعرض رسالة واضحة)
   ═══════════════════════════════════════════════════════════ */
function getFinancialPositionAt(dateStr) {
  // النهاردة = live
  if (dateStr === today()) {
    return getCurrentFinancialPosition();
  }

  // لو نفس يوم db.date الحالي
  if (dateStr === db.date) {
    return getCurrentFinancialPosition();
  }

  // غير كده = snapshot
  const snap = (db.dailySnapshots || []).find(s => s.date === dateStr);
  if (snap) return snap;

  // مفيش snapshot → نرجع null عشان التقرير يعرض رسالة واضحة
  return null;
}

/* ═══════════════════════════════════════════════════════════
   أخذ Snapshot لليوم الحالي
   ═══════════════════════════════════════════════════════════ */
function takeDailySnapshot() {
  if (!db.dailySnapshots) db.dailySnapshots = [];
  const pos = getCurrentFinancialPosition();
  db.dailySnapshots = db.dailySnapshots.filter(s => s.date !== db.date);
  db.dailySnapshots.push({
    date: db.date,
    cash: pos.cash,
    vodafone: pos.vodafone,
    invValue: pos.invValue,
    finishedGoods: pos.finishedGoods,
    customersDebt: pos.customersDebt,
    workersDebt: pos.workersDebt,
    workersReceivable: pos.workersReceivable,
    handoversOpen: pos.handoversOpen,
    suppliersDebt: pos.suppliersDebt,
    assets: pos.assets,
    liabilities: pos.liabilities,
    net: pos.net
  });
  db.dailySnapshots.sort((a, b) => parseDate(a.date) - parseDate(b.date));
}
</script>

function openBatchModal() {
  if (!db.dayStarted) return toast('يجب بدء اليوم أولاً', 'error');
  const flourQty = getInventoryQty('دقيق');

  openModal('تسجيل عجنة جديدة',
    `<div class="summary-box" style="margin-bottom:16px;">
       <div class="summary-row"><span>الدقيق المتاح:</span><b style="color:${flourQty > 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(flourQty)} شيكارة</b></div>
     </div>
     <div class="form-group"><label>عدد الطوايل</label><input type="text" inputmode="numeric" id="bTawla" class="form-control" oninput="blockInt(this);calcBatch()" placeholder="مثال: 10"></div>
     <div class="form-group">
       <label>الدقيق (شيكارة) — اكتب أي كمية</label>
       <input type="text" inputmode="decimal" id="bFlour" class="form-control" oninput="blockDec(this);calcBatch()" placeholder="مثال: 1.5" value="1">
       <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(0.25)">¼</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(0.5)">½</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(0.75)">¾</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(1)">1</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(1.25)">1¼</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(1.5)">1½</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(2)">2</button>
         <button type="button" class="btn btn-sm btn-secondary" onclick="setFlourQty(3)">3</button>
       </div>
     </div>
     <div class="form-row">
       <div class="form-group"><label style="color:var(--danger)">الكسر</label><input type="text" inputmode="numeric" id="bKasr" class="form-control" oninput="blockInt(this);calcBatch()"></div>
       <div class="form-group"><label style="color:var(--danger)">السحله</label><input type="text" inputmode="numeric" id="bSahla" class="form-control" oninput="blockInt(this);calcBatch()"></div>
     </div>
     <div class="summary-box primary">
       <div class="summary-row"><span>الإجمالي:</span><span id="calcTotal">0</span></div>
       <div class="summary-row" style="color:#fca5a5;"><span>الهالك:</span><span id="calcWaste">0</span></div>
       <div class="summary-row" style="color:var(--accent); font-size:18px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; margin-top: 8px; font-weight: 900;"><span>الصافي:</span><span id="calcNet">0</span></div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-accent" onclick="saveBatch(this)">حفظ العجنة</button>`
  );
  calcBatch();
}

function setFlourQty(v) {
  const el = document.getElementById('bFlour');
  if (el) { el.value = v; calcBatch(); }
}

function calcBatch() {
  const t = num('bTawla');
  const k = num('bKasr');
  const s = num('bSahla');
  const bpT = db.settings.breadPerTawla || 20;
  const total = t * bpT;
  const waste = k + s;
  const net = Math.max(0, total - waste);
  if ($('calcTotal')) $('calcTotal').textContent = fmt(total) + ' رغيف';
  if ($('calcWaste')) $('calcWaste').textContent = fmt(waste) + ' رغيف';
  if ($('calcNet')) $('calcNet').textContent = fmt(net) + ' رغيف';
}

function saveBatch(btn) {
  const t = num('bTawla');
  const flour = num('bFlour');
  const kasr = num('bKasr');
  const sahla = num('bSahla');

  if (t <= 0) return toast('أدخل عدد طوايل صحيح', 'error');
  if (flour <= 0) return toast('أدخل كمية دقيق صحيحة', 'error');
  if (!checkInventory('دقيق', flour)) return toast(`الدقيق غير كافي! المتاح ${fmt(getInventoryQty('دقيق'))} شيكارة`, 'error');

  const bpT = db.settings.breadPerTawla || 20;
  const totalBreads = t * bpT;
  const waste = kasr + sahla;
  if (waste > totalBreads) return toast('الهالك أكبر من الإجمالي!', 'error');

  const netBreads = totalBreads - waste;
  const price = db.settings.breadPrice || 0;
  const netMoney = netBreads * price;

  const summary = `
    <div>عدد الطوايل: <strong>${t} طاولة</strong></div>
    <div>الدقيق: <strong>${flour} شيكارة</strong></div>
    <div>الهالك: <strong>${waste} رغيف</strong></div>
    <div>صافي الإنتاج: <strong>${netBreads} رغيف</strong></div>
    <div>القيمة بسعر البيع: <strong>${fmt(netMoney)} ج</strong></div>
  `;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      const flourCost = deductInventory('دقيق', flour);
      db.production.push({
        id: uid(), date: db.date, employee: currentUser.name, type: 'batch',
        tawla: t, flourUsed: flour, kasr: kasr, sahla: sahla, waste: waste,
        totalBreads: totalBreads, netBreads: netBreads, netMoney: netMoney, cost: flourCost
      });
      logAction('تسجيل عجنة', `${t} طاولة - صافي ${netBreads} رغيف`);
      saveDB();
      closeModal();
      toast('تم حفظ العجنة', 'success');
      updateTopbar();
      nav('production');
    }
  });
}

function openConsumablesModal() {
  const items = Object.keys(db.inventory).filter(k => k !== 'دقيق');
  if (items.length === 0) {
    return toast('لا توجد أصناف — أضف صنف أولاً', 'error');
  }

  const rows = items.map(k => {
    const unit = db.itemUnits[k] || '';
    const suggestions = getUnitSuggestions(unit);
    return `
    <div class="form-group" style="background:var(--bg-alt); padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;">
      <label style="font-weight:900; display:flex; justify-content:space-between;">
        <span>${esc(k)} <span style="font-size:11px; color:var(--text-muted);">(${esc(unit)})</span></span>
        <span style="font-size:11px; color:var(--text-muted);">متاح: ${fmt(getInventoryQty(k))}</span>
      </label>
      <input type="text" inputmode="decimal" id="cons_qty_${esc(k)}" class="form-control" oninput="blockDec(this)" placeholder="اكتب الكمية">
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
        ${suggestions.map(v => `<button type="button" class="btn btn-sm btn-secondary" onclick="setConsQty('${esc(k)}', ${v})">${v}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  openModal('تسجيل المستهلكات',
    `<div class="info-bar" style="margin-bottom:16px;"><i class="fas fa-info-circle"></i> سيتم خصمها من المخزن</div>
     ${rows}
     <button type="button" class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="openAddConsumableItemModal()">
       <i class="fas fa-plus"></i> إضافة صنف جديد
     </button>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-accent" onclick="saveConsumables(this)">حفظ</button>`
  );
}

function getUnitSuggestions(unit) {
  if (unit === 'أسطوانة') return [1, 2, 3];
  if (unit === 'كيلو') return [0.5, 1, 2, 5];
  if (unit === 'باكو') return [0.25, 0.5, 1, 2];
  if (unit === 'شيكارة') return [0.25, 0.5, 1, 2];
  if (unit === 'كيس') return [0.5, 1, 5, 10];
  return [0.5, 1, 2];
}

function setConsQty(item, val) {
  const el = document.getElementById('cons_qty_' + item);
  if (el) el.value = val;
}

function saveConsumables(btn) {
  const items = Object.keys(db.inventory).filter(k => k !== 'دقيق');
  const toSave = [];

  for (let k of items) {
    const inp = document.getElementById('cons_qty_' + k);
    if (!inp) continue;
    const qty = parseFloat(inp.value) || 0;
    if (qty > 0) {
      if (!checkInventory(k, qty)) return toast(`رصيد ${k} غير كافي!`, 'error');
      toSave.push({ item: k, qty });
    }
  }

  if (toSave.length === 0) return toast('لم يتم إدخال أي كميات', 'warning');

  const summary = toSave.map(s => `<div>${esc(s.item)}: <strong>${s.qty}</strong></div>`).join('');

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      toSave.forEach(s => {
        const cost = deductInventory(s.item, s.qty);
        db.production.push({
          id: uid(), date: db.date, type: 'consumables', item: s.item, qty: s.qty,
          cost: cost, desc: `مستهلكات: ${s.item}`, employee: currentUser.name
        });
      });
      logAction('تسجيل مستهلكات', toSave.map(s => s.item).join(' | '));
      saveDB();
      closeModal();
      toast('تم حفظ المستهلكات', 'success');
      nav('production');
    }
  });
}

function openAddConsumableItemModal() {
  const backup = {};
  Object.keys(db.inventory).filter(k => k !== 'دقيق').forEach(k => {
    const inp = document.getElementById('cons_qty_' + k);
    if (inp && inp.value) backup[k] = inp.value;
  });
  window.__consBackup = backup;

  openModal('إضافة صنف جديد',
    `<div class="info-bar" style="margin-bottom:16px;"><i class="fas fa-info-circle"></i> الصنف هيتضاف للمخزون برصيد صفر (تقدر تسجله في المشتريات بعدين).</div>
     <div class="form-group">
       <label>اسم الصنف</label>
       <input type="text" id="newConsItemName" class="form-control" placeholder="مثال: زبدة">
     </div>
     <div class="form-row">
       <div class="form-group">
         <label>الوحدة</label>
         <select id="newConsItemUnit" class="form-control">
           <option>كيلو</option><option>شيكارة</option><option>أسطوانة</option>
           <option>باكو</option><option>كيس</option><option>علبة</option><option>قطعة</option>
         </select>
       </div>
       <div class="form-group">
         <label>سعر الوحدة (ج) — اختياري</label>
         <input type="text" inputmode="numeric" id="newConsItemPrice" class="form-control" oninput="blockInt(this)">
       </div>
     </div>`,
    `<button class="btn btn-secondary" onclick="backToConsumables()">رجوع</button>
     <button class="btn btn-accent" onclick="doAddConsumableItem()">إضافة</button>`
  );
}

function backToConsumables() {
  closeModal();
  setTimeout(() => {
    openConsumablesModal();
    setTimeout(() => {
      if (window.__consBackup) {
        Object.keys(window.__consBackup).forEach(k => {
          const inp = document.getElementById('cons_qty_' + k);
          if (inp) inp.value = window.__consBackup[k];
        });
        window.__consBackup = null;
      }
    }, 80);
  }, 100);
}

function doAddConsumableItem() {
  const name = getStr('newConsItemName');
  const unit = getStr('newConsItemUnit');
  const price = num('newConsItemPrice');

  if (!name) return toast('أدخل اسم الصنف', 'error');
  if (db.inventory[name] !== undefined) return toast('الصنف موجود بالفعل', 'error');

  db.inventory[name] = 0;
  db.invLayers[name] = [];
  db.minStock[name] = 0;
  db.itemUnits[name] = unit;

  if (price > 0) {
    if (name === 'غاز') db.settings.defaultGasPrice = price;
    else if (name === 'خميرة') db.settings.defaultYeastPrice = price;
    else if (name === 'أكياس') db.settings.defaultBagsPrice = price;
  }

  saveDB();
  logAction('إضافة صنف', name);
  toast('تمت إضافة الصنف — رصيده صفر لحد ما تشتريه', 'success');
  backToConsumables();
}

function promptCloseProduction() {
  if (!canEdit('production')) return toast('غير مصرح', 'error');
  if (db.isRestDay) return toast('يوم راحة', 'error');

  const todayBatches = db.production.filter(r => r.date === getViewDate() && r.type !== 'consumables');
  const todayConsumables = db.production.filter(r => r.date === getViewDate() && r.type === 'consumables');

  if (todayBatches.length === 0) {
    return showConfirm('إغلاق الإنتاج', 'لا يوجد إنتاج اليوم. هل تريد الإغلاق؟', () => {
      db.closed.production = true;
      logAction('إغلاق الإنتاج (بدون إنتاج)');
      saveDB();
      toast('تم إغلاق الإنتاج', 'success');
      nav('production');
    });
  }

  if (todayConsumables.length === 0) {
    return openModal('⚠️ لا يمكن الإغلاق',
      `<div class="danger-banner">يجب تسجيل المستهلكات أولاً قبل إغلاق الإنتاج</div>`,
      `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
       <button class="btn btn-accent" onclick="closeModal(); openConsumablesModal();">تسجيل المستهلكات الآن</button>`
    );
  }

  const pending = db.handovers.filter(h => h.date === getViewDate() && h.paid < h.amount);
  const pendingAmount = pending.reduce((a, h) => a + (h.amount - h.paid), 0);

  const warn = pendingAmount > 0.01
    ? `<div class="warning-banner"><i class="fas fa-exclamation-triangle"></i> يوجد ${fmt(pendingAmount)} ج عهد غير محصلة</div><p style="text-align:center; margin-top:16px;">هل أنت متأكد من الإغلاق؟</p>`
    : `<p style="text-align:center; font-weight:700;">كل العهد محصلة ✅<br>هل أنت متأكد من الإغلاق؟</p>`;

  showConfirm('إغلاق الإنتاج', warn, () => {
    db.closed.production = true;
    logAction('إغلاق الإنتاج');
    saveDB();
    toast('تم إغلاق الإنتاج', 'success');
    nav('production');
  });
}

function reopenProduction() {
  requireAdminPin('إعادة فتح الإنتاج', () => {
    db.closed.production = false;
    logAction('إعادة فتح الإنتاج');
    saveDB();
    toast('تم الفتح', 'success');
    nav('production');
  });
}

function isOpeningSectionFilled(section) {
  const o = db.opening || {};
  if (section === 'treasury') return (o.treasury?.cash || 0) > 0 || (o.treasury?.vodafone || 0) > 0;
  if (section === 'stock') return Object.keys(o.stockData || {}).length > 0;
  if (section === 'workers') return Object.keys(o.workerDebts || {}).length > 0 || Object.keys(o.workerReceivables || {}).length > 0;
  if (section === 'customers') return Object.keys(o.customersDebts || {}).length > 0;
  if (section === 'suppliers') return Object.keys(o.suppliersDebts || {}).length > 0;
  return false;
}

function renderOpeningBalances() {
  currentSubScreen = 'opening-main';
  const o = db.opening || {};
  const isApplied = o.done === true;
  const sections = [
    { id: 'treasury', title: 'أرصدة الخزنة', desc: 'كاش + فودافون', icon: 'fa-money-bill-wave', color: 'var(--success)', bg: 'var(--success-bg)' },
    { id: 'stock', title: 'المخزون الافتتاحي', desc: 'كميات وأسعار الأصناف', icon: 'fa-warehouse', color: 'var(--warning)', bg: 'var(--warning-bg)' },
    { id: 'workers', title: 'أرصدة العمال', desc: 'اللي عليهم واللي ليهم', icon: 'fa-hard-hat', color: 'var(--info)', bg: 'var(--info-bg)' },
    { id: 'customers', title: 'ديون العملاء', desc: 'الرصيد الافتتاحي للعملاء', icon: 'fa-user-tie', color: 'var(--primary)', bg: 'var(--primary-lighter)' },
    { id: 'suppliers', title: 'ديون الموردين', desc: 'الرصيد الافتتاحي للموردين', icon: 'fa-truck-loading', color: 'var(--accent-)', bg: 'var(--accent-lighter)' }
  ];

  const cardsHTML = sections.map(s => {
    const filled = isOpeningSectionFilled(s.id);
    return `
      <div class="opening-card" onclick="openOpeningSection('${s.id}')">
        <div class="opening-card-icon" style="background:${s.bg}; color:${s.color};"><i class="fas ${s.icon}"></i></div>
        <div class="opening-card-info">

        <i class="fas fa-chevron-left" style="color:var(--text-muted);"></i>
      </div>

  const anyFilled = sections.some(s => isOpeningSectionFilled(s.id));

  document.getElementById('content').innerHTML = `

      <div class="page-title">
        <i class="fas fa-flag-checkered"></i>
        <div class="page-title-text"><span class="page-title-main">الأرصدة الافتتاحية</span></div>
      </div>
      ${isApplied ? `<span class="pill pill-success">مطبّقة على النظام</span>` : anyFilled ? `<span class="pill pill-warning">بانتظار التطبيق</span>` : `<span class="pill pill-warning">لم يتم الإدخال</span>`}
    </div>

    <div class="info-bar" style="margin-bottom:16px;">
      <i class="fas fa-info-circle"></i>
      ${isApplied
        ? '<b>وضع التعديل:</b> عند الحفظ، القيم القديمة تُعكس ويُطبّق الجديد. تأكد من صحة الأرقام قبل الحفظ.'
        : '<b>ملاحظة:</b> كل حاجة تُحفظ هنا مؤقتاً لحد ما تضغط "تطبيق على النظام" تحت. ده يمنع الحفظ الجزئي.'}

function updateOpeningDate(val) {
  if (!db.opening) db.opening = { done: false, date: today(), treasury: { cash: 0, vodafone: 0 } };
  db.opening.date = val.split('-').reverse().join('/');
  saveDB();
}

function openOpeningSection(section) {
  currentSubScreen = 'opening-' + section;
  ensureBackupState();
  if (section === 'treasury') renderOpeningTreasury();
  else if (section === 'stock') renderOpeningStock();
  else if (section === 'workers') renderOpeningWorkers();
  else if (section === 'customers') renderOpeningCustomers();
  else if (section === 'suppliers') renderOpeningSuppliers();
}

function backToOpeningMain() {
  currentSubScreen = null;
  renderOpeningBalances();
}

function confirmApplyAll() {
  const o = db.opening;
  const hasAnything = (o.treasury?.cash > 0) || (o.treasury?.vodafone > 0)
    || Object.keys(o.stockData || {}).length > 0
    || Object.keys(o.workerDebts || {}).length > 0
    || Object.keys(o.workerReceivables || {}).length > 0
    || Object.keys(o.customersDebts || {}).length > 0
    || Object.keys(o.suppliersDebts || {}).length > 0;

  if (!hasAnything) return toast('لم يتم إدخال أي أرصدة', 'warning');

  const isEdit = o.done === true;
  const summary = `
    <div>💵 خزنة كاش: <strong>${fmt(o.treasury?.cash || 0)} ج</strong></div>
    <div>📱 فودافون: <strong>${fmt(o.treasury?.vodafone || 0)} ج</strong></div>
    <div>📦 أصناف مخزون: <strong>${Object.keys(o.stockData || {}).length}</strong></div>
    <div>👷 عمال عليهم: <strong>${Object.keys(o.workerDebts || {}).length}</strong></div>
    <div>👷 عمال لهم: <strong>${Object.keys(o.workerReceivables || {}).length}</strong></div>
    <div>👤 عملاء مدينون: <strong>${Object.keys(o.customersDebts || {}).length}</strong></div>
    <div>🚚 موردون دائنون: <strong>${Object.keys(o.suppliersDebts || {}).length}</strong></div>
    ${isEdit ? '<div style="margin-top:8px; color:var(--danger);">⚠️ سيتم عكس الأرصدة القديمة وتطبيق الجديدة</div>' : ''}
  `;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      if (isEdit) reverseOpeningBalancesEffects();
      applyOpeningBalancesToSystem();
      o.done = true;
      saveDB();
      toast('تم تطبيق الأرصدة على النظام', 'success');
      nav('admin');
    }
  });
}

function applyOpeningBalancesToSystem() {
  const o = db.opening;
  const date = o.date || today();

  if (o.treasury?.cash > 0) {
    db.treasury.push({ id: uid(), date, employee: 'افتتاحي', type: 'in', amount: o.treasury.cash, method: 'cash', category: 'opening', desc: 'رصيد افتتاحي كاش' });
  }
  if (o.treasury?.vodafone > 0) {
    db.treasury.push({ id: uid(), date, employee: 'افتتاحي', type: 'in', amount: o.treasury.vodafone, method: 'vodafone', category: 'opening', desc: 'رصيد افتتاحي فودافون' });
  }

  Object.keys(o.stockData || {}).forEach(item => {
    const { qty, price } = o.stockData[item];
    if (!db.invLayers[item]) db.invLayers[item] = [];
    db.invLayers[item].push({ qty, price });
    db.inventory[item] = (db.inventory[item] || 0) + qty;
    db.invLog.push({ id: uid(), date, type: 'in', item, qty, desc: 'رصيد افتتاحي', cost: qty * price });
  });

  Object.keys(o.workerDebts || {}).forEach(name => {
    db.workerLedger.push({ id: uid(), date, worker: name, type: 'رصيد افتتاحي', amount: o.workerDebts[name], desc: 'دين افتتاحي', status: 'unpaid' });
  });

  Object.keys(o.workerReceivables || {}).forEach(name => {
    db.workerOpeningReceivables.push({ id: uid(), date, worker: name, amount: o.workerReceivables[name], desc: 'مستحق افتتاحي', status: 'unpaid' });
  });

  Object.keys(o.customersDebts || {}).forEach(name => {
    let c = db.customers.find(x => x.name === name);
    if (!c) { c = { name, debt: 0, phone: '' }; db.customers.push(c); }
    c.debt = (+c.debt || 0) + o.customersDebts[name];
  });

  Object.keys(o.suppliersDebts || {}).forEach(name => {
    let s = db.suppliers.find(x => x.name === name);
    if (!s) { s = { name, debt: 0 }; db.suppliers.push(s); }
    s.debt = (+s.debt || 0) + o.suppliersDebts[name];
  });

  // 🆕 حفظ نسخة من البيانات المطبقة عشان نقدر نلغيها بعدين بنجاح
  o.appliedData = JSON.parse(JSON.stringify(o));

  logAction('تطبيق الأرصدة الافتتاحية', `خزنة: ${fmt((o.treasury?.cash || 0) + (o.treasury?.vodafone || 0))}`);
}

function reverseOpeningBalancesEffects() {
  const o = db.opening;
  if (!o) return;

  // بنعتمد على النسخة اللي اتطبقت فعلاً، ولو مفيش (نسخة قديمة) بناخد الحالية
  const applied = o.appliedData || o;

  // 1) الخزنة
  db.treasury = db.treasury.filter(t => t.category !== 'opening');

  // 2) المخزون
  if (applied.stockData) {
    Object.keys(applied.stockData).forEach(item => {
      const appliedQty = applied.stockData[item].qty;
      
      // خصم الكمية القديمة من الرصيد الإجمالي
      db.inventory[item] = Math.max(0, (db.inventory[item] || 0) - appliedQty);
      
      // خصم الكمية من الطبقات (FIFO) عشان منبوظش تكلفة المشتريات
      if (db.invLayers[item] && db.invLayers[item].length > 0) {
        let toRemove = appliedQty;
        for (let i = 0; i < db.invLayers[item].length && toRemove > 0.001; i++) {
          const take = Math.min(db.invLayers[item][i].qty, toRemove);
          db.invLayers[item][i].qty -= take;
          toRemove -= take;
        }
        db.invLayers[item] = db.invLayers[item].filter(l => l.qty > 0.001);
      }
    });
    db.invLog = db.invLog.filter(l => l.desc !== 'رصيد افتتاحي');
  }

  // 3) العمال
  db.workerLedger = db.workerLedger.filter(l => l.type !== 'رصيد افتتاحي');
  db.workerOpeningReceivables = db.workerOpeningReceivables.filter(l => l.desc !== 'مستحق افتتاحي');

  // 4) العملاء
  if (applied.customersDebts) {
    Object.keys(applied.customersDebts).forEach(name => {
      const c = db.customers.find(x => x.name === name);
      if (c) c.debt = Math.max(0, (+c.debt || 0) - applied.customersDebts[name]);
    });
  }

  // 5) الموردين
  if (applied.suppliersDebts) {
    Object.keys(applied.suppliersDebts).forEach(name => {
      const s = db.suppliers.find(x => x.name === name);
      if (s) s.debt = Math.max(0, (+s.debt || 0) - applied.suppliersDebts[name]);
    });
  }

  // تصفير النسخة القديمة
  o.appliedData = null;
}

function confirmResetOpening() {
  showConfirm('إلغاء الأرصدة',
    'سيتم إلغاء كل الأرصدة من النظام والبدء من جديد. متأكد؟',
    () => {
      requireAdminPin('إعادة إدخال الأرصدة', () => {
        reverseOpeningBalancesEffects();
        db.opening = { done: false, date: today(), treasury: { cash: 0, vodafone: 0 }, stockData: {}, workerDebts: {}, workerReceivables: {}, customersDebts: {}, suppliersDebts: {} };
        saveDB();
        toast('تم الإلغاء', 'info');
        renderOpeningBalances();
      });
    }, true
  );
}
</script>

      html += `

    body = `
      <div class="warning-banner" style="margin-bottom:16px;"><i class="fas fa-info-circle"></i> المتاح: <b>${fmt(avail)} ج</b></div>
      <div class="form-group"><label>المبلغ</label><input type="text" inputmode="numeric" id="dMoney" class="form-control" oninput="blockInt(this)"></div>
    `;
  }

  openModal('تسجيل ' + type, body,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-accent" onclick="saveDist('${type}', ${avail})">حفظ</button>`
  );

  if (type === 'أوردر') calcOrder();
  if (type === 'استاند') checkStandWorker();
}

function checkStandWorker() {
  const stand = getStr('dStand');
  if (!stand) return;
  const existing = db.handovers.find(h => h.date === db.date && h.type === 'استاند' && h.name === stand);
  const workerDiv = document.getElementById('workerDiv');
  if (existing) {
    workerDiv.innerHTML = `
      <label>المندوب (مقفول)</label>
      <input type="text" class="form-control" value="${esc(existing.employee)}" disabled style="background:var(--bg-alt); color:var(--text-muted);">
      <input type="hidden" id="dLockedWorker" value="${esc(existing.employee)}">
    `;
  } else {
    const workersOptions = db.workers.map(w => `<option value="${esc(w.name)}">${esc(w.name)}</option>`).join('') || '<option value="">لا يوجد عمال</option>';
    workerDiv.innerHTML = `<label>المندوب</label><select id="dWorker" class="form-control">${workersOptions}</select>`;
  }
}

function calcOrder() {
  const total = num('dTotal'), disc = num('dDisc'), paid = num('dPaid');
  const net = Math.max(0, total - disc);
  const debt = Math.max(0, net - paid);
  const maxDisc = total * (db.settings.maxDiscountPercent / 100);
  const elNet = document.getElementById('calcNet');
  const elDebt = document.getElementById('calcDebt');

  if (disc > maxDisc) {
    if (elNet) elNet.innerHTML = `<span style="color:#FCA5A5;">تجاوز الحد (${db.settings.maxDiscountPercent}%)</span>`;
  } else {
    if (elNet) elNet.textContent = fmt(net) + ' ج';
  }
  if (elDebt) elDebt.textContent = fmt(debt) + ' ج';
}

function saveDist(type, avail) {
  if (type === 'استاند') {
    const stand = getStr('dStand');
    let worker = getStr('dLockedWorker') || getStr('dWorker');
    const money = num('dMoney');

    if (!stand) return toast('اختر الاستاند', 'error');
    if (!worker) return toast('اختر المندوب', 'error');
    if (money <= 0) return toast('أدخل مبلغ صحيح', 'error');
    if (money > avail + 0.01) return toast(`المبلغ أكبر من المتاح (${fmt(avail)} ج)`, 'error');

    const summary = `
      <div>الاستاند: <strong>${esc(stand)}</strong></div>
      <div>المندوب: <strong>${esc(worker)}</strong></div>
      <div>قيمة العهدة: <strong>${fmt(money)} ج</strong></div>
    `;

    requireSaveConfirm({
      summary,
      onConfirm: () => {
        db.distRecords.push({
          id: uid(), date: db.date, type: 'استاند', name: stand, worker,
          money, gross: money, discount: 0, paidAmount: money, debtAmount: 0,
          details: `عهدة لـ ${worker}`, employee: currentUser.name
        });
        let existing = db.handovers.find(h => h.date === db.date && h.type === 'استاند' && h.name === stand);
        if (existing) {
          existing.amount += money;
          db.handoverLines.push({
            id: uid(), handoverId: existing.id, date: db.date, type: 'استاند',
            name: stand, employee: worker, amount: money, source: 'new',
            desc: `عهدة إضافية - ${stand}`, createdAt: db.date
          });
        } else {
          const hId = uid();
          db.handovers.push({ id: hId, date: db.date, employee: worker, type: 'استاند', name: stand, amount: money, paid: 0 });
          db.handoverLines.push({
            id: uid(), handoverId: hId, date: db.date, type: 'استاند',
            name: stand, employee: worker, amount: money, source: 'original',
            desc: `عهدة أصلية - ${stand}`, createdAt: db.date
          });
        }
        logAction('توزيع استاند', `${stand} → ${worker} - ${fmt(money)} ج`);
        saveDB();
        closeModal();
        toast('تم حفظ العهدة', 'success');
        updateTopbar();
        nav('distribution');
      }
    });

  } else if (type === 'أوردر') {
    const cust = getStr('dCust');
    const total = num('dTotal'), disc = num('dDisc'), paid = num('dPaid');
    const method = getStr('dMethod', 'cash');

    if (total <= 0) return toast('أدخل إجمالي الأوردر', 'error');
    if (total > avail + 0.01) return toast(`المبلغ أكبر من المتاح`, 'error');

    const maxDisc = total * (db.settings.maxDiscountPercent / 100);
    if (disc > maxDisc) return toast(`الخصم يتجاوز الحد (${db.settings.maxDiscountPercent}%)`, 'error');

    const net = Math.max(0, total - disc);
    if (paid > net) return toast('المدفوع أكبر من الصافي', 'error');
    const debt = net - paid;

    const summary = `
      <div>العميل: <strong>${esc(cust)}</strong></div>
      <div>الإجمالي: <strong>${fmt(total)} ج</strong></div>
      <div>الخصم: <strong>${fmt(disc)} ج</strong></div>
      <div>الصافي: <strong>${fmt(net)} ج</strong></div>
      <div>المدفوع (${method === 'cash' ? 'كاش' : 'فودافون'}): <strong>${fmt(paid)} ج</strong></div>
      ${debt > 0 ? `<div style="color:var(--danger);">الآجل: <strong>${fmt(debt)} ج</strong></div>` : ''}
    `;

    requireSaveConfirm({
      summary,
      onConfirm: () => {
        db.distRecords.push({
          id: uid(), date: db.date, type: 'أوردر', name: cust, gross: total, money: net,
          discount: disc, paidAmount: paid, debtAmount: debt,
          details: `إجمالي ${total} | خصم ${disc} | مدفوع ${paid} | آجل ${debt}`,
          employee: currentUser.name
        });

        if (debt > 0) {
          let customer = db.customers.find(c => c.name === cust);
          if (!customer) { customer = { name: cust, debt: 0, phone: '' }; db.customers.push(customer); }
          customer.debt += debt;
        }
        if (paid > 0) {
          db.treasury.push({
            id: uid(), date: db.date, employee: currentUser.name, type: 'in', amount: paid,
            method, category: 'order_payment', desc: 'دفعة أوردر: ' + cust
          });
        }

        logAction('توزيع أوردر', `${cust} - صافي ${fmt(net)} - آجل ${fmt(debt)}`);
        saveDB();
        updateTopbar();
        closeModal();
        toast('تم حفظ الأوردر', 'success');
        nav('distribution');
      }
    });

  } else {
    const money = num('dMoney');
    if (money <= 0) return toast('أدخل مبلغ صحيح', 'error');
    if (money > avail + 0.01) return toast('المبلغ أكبر من المتاح', 'error');

    const summary = `<div>المبلغ: <strong>${fmt(money)} ج</strong></div><div>على المندوب: <strong>${esc(currentUser.name)}</strong></div>`;

    requireSaveConfirm({
      summary,
      onConfirm: () => {
        db.distRecords.push({
          id: uid(), date: db.date, type: 'بيع مباشر', name: 'بيع مباشر',
          money, gross: money, discount: 0, paidAmount: money, debtAmount: 0,
          details: `عهدة بيع مباشر`, employee: currentUser.name
        });
        const hId = uid();
        db.handovers.push({
          id: hId, date: db.date, employee: currentUser.name, type: 'بيع مباشر',
          name: 'بيع مباشر', amount: money, paid: 0
        });
        db.handoverLines.push({
          id: uid(), handoverId: hId, date: db.date, type: 'بيع مباشر',
          name: 'بيع مباشر', employee: currentUser.name, amount: money, source: 'original',
          desc: `عهدة بيع مباشر`, createdAt: db.date
        });
        logAction('بيع مباشر', `${fmt(money)} ج`);
        saveDB();
        closeModal();
        toast('تم حفظ البيع المباشر', 'success');
        updateTopbar();
        nav('distribution');
      }
    });
  }
}

function promptCloseDistribution() {
  const avail = getAvailableToDistribute();
  if (avail > 0.01) return toast(`لا يمكن الإغلاق — متبقي ${fmt(avail)} ج`, 'error');
  showConfirm('إغلاق التوزيع', 'الأرقام مطابقة، ولا يوجد عيش متاح. متأكد؟', () => {
    db.closed.distribution = true;
    logAction('إغلاق التوزيع');
    saveDB();
    toast('تم إغلاق التوزيع', 'success');
    nav('distribution');
  });
}

function reopenDistribution() {
  requireAdminPin('إعادة فتح التوزيع', () => {
    db.closed.distribution = false;
    logAction('إعادة فتح التوزيع');
    saveDB();
    toast('تم الفتح', 'success');
    nav('distribution');
  });
}

function cancelDist(id) {
  if (!isAdmin()) return toast('غير مصرح', 'error');
  const r = db.distRecords.find(d => d.id === id);
  if (!r) return;

  showConfirm('إلغاء حركة', `حذف <b>${esc(r.type)}</b> بقيمة <b>${fmt(r.money)} ج</b>؟`, () => {
    requireAdminPin('حذف توزيع', () => {
      if (r.type === 'أوردر') {
        const debtAmt = r.debtAmount || 0;
        if (debtAmt > 0) {
          const c = db.customers.find(x => x.name === r.name);
          if (c) c.debt = Math.max(0, c.debt - debtAmt);
        }
        if (r.paidAmount > 0) {
          db.treasury = db.treasury.filter(t => !(t.date === r.date && t.desc === 'دفعة أوردر: ' + r.name && t.type === 'in'));
        }
      }
      if (r.type === 'استاند' || r.type === 'بيع مباشر') {
        const h = db.handovers.find(x => x.date === r.date && x.type === r.type && x.name === r.name);
        if (h) {
          h.amount -= r.money;
          if (h.amount <= 0.01) db.handovers = db.handovers.filter(x => x.id !== h.id);
        }
      }
      db.distRecords = db.distRecords.filter(x => x.id !== id);
      logAction('حذف توزيع', r.type + ' - ' + r.name);
      saveDB();
      toast('تم الحذف', 'success');
      updateTopbar();
      nav('distribution');
    });
  }, true);
}
</script>

    <div class="card" style="background:linear-gradient(135deg, #3B82F6 0%, #1e3a8a 100%); color:#fff; border-radius:16px; padding:20px; margin-bottom:20px; display:flex; justify-content:space-around; align-items:center; box-shadow:0 10px 20px rgba(59,130,246,0.2);">

      </div>

    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
      <div class="card clickable" onclick="accTab='collections'; nav('accounting')" style="cursor:pointer; padding:15px; text-align:center; border-right:4px solid var(--success); border-radius:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border);">
        <i class="fas fa-hand-holding-usd" style="font-size:24px; color:var(--success); margin-bottom:8px;"></i>
        <div style="font-size:13px; font-weight:900;">التحصيلات</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">عهد: ${fmt(remainingHandovers)} ج</div>

      </div>
      
      <div class="card clickable" onclick="accTab='deferred'; nav('accounting')" style="cursor:pointer; padding:15px; text-align:center; border-right:4px solid var(--warning); border-radius:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border);">
        <i class="fas fa-file-invoice-dollar" style="font-size:24px; color:var(--warning); margin-bottom:8px;"></i>
        <div style="font-size:13px; font-weight:900;">الآجل (العملاء)</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">إجمالي الديون</div>
        <div style="font-size:12px; font-weight:bold; color:var(--danger); margin-top:4px;">${fmt(customerDebts)} ج</div>
      </div>
      
      <div class="card clickable" onclick="accTab='treasury'; nav('accounting')" style="cursor:pointer; padding:15px; text-align:center; border-right:4px solid var(--primary); border-radius:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border);">

      <div class="card clickable" onclick="accTab='expenses'; nav('accounting')" style="cursor:pointer; padding:15px; text-align:center; border-right:4px solid var(--danger); border-radius:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border);">
        <i class="fas fa-money-bill-transfer" style="font-size:24px; color:var(--danger); margin-bottom:8px;"></i>

  function renderAccCollections() {
  const openHandovers = getAllOpenHandovers();
  const openWorkerDebts = db.workerLedger.filter(l => l.status !== 'paid' && (+l.amount || 0) > 0);

  const handoverMap = {};
  openHandovers.forEach(h => {
    const name = h.employee || 'غير محدد';
    if (!handoverMap[name]) handoverMap[name] = { amount: 0, types: new Set() };
    handoverMap[name].amount += (h.amount - h.paid);
    handoverMap[name].types.add(h.type === 'استاند' ? `استاند: ${h.name}` : h.type);
  });

  const debtMap = {};
  openWorkerDebts.forEach(l => {
    const name = l.worker;
    if (!debtMap[name]) debtMap[name] = { amount: 0, types: new Set() };
    debtMap[name].amount += (+l.amount || 0);
    debtMap[name].types.add(l.type);
  });

  const receivableMap = {};
  db.workers.forEach(w => {
    const amt = getWorkerReceivable(w.name);
    if (amt > 0.01) receivableMap[w.name] = { amount: amt };
  });

  const totalHandover = Object.keys(handoverMap).reduce((a, n) => a + handoverMap[n].amount, 0);
  const totalDebt = Object.keys(debtMap).reduce((a, n) => a + debtMap[n].amount, 0);
  const totalReceivable = Object.keys(receivableMap).reduce((a, n) => a + receivableMap[n].amount, 0);

  let contentHTML = '';

  if (accCollTab === 'handovers') {
    contentHTML = Object.keys(handoverMap).length ? Object.keys(handoverMap).map(name => {
      const data = handoverMap[name];
      return `
        <div style="display:flex; flex-direction:column; padding:14px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; gap:10px; border-right:4px solid var(--accent);">
          <div style="display:flex; justify-content:space-between; align-items:start;">
            <h5 style="font-size:15px; font-weight:900; cursor:pointer; color:var(--primary); display:flex; align-items:center; gap:6px;" onclick="viewHandoverDetails('${esc(name)}')">
              ${esc(name)} <i class="fas fa-info-circle" style="font-size:14px; color:var(--info);"></i>
            </h5>
            <div style="text-align:left; font-size:11px;">${[...data.types].map(t => `<span class="pill pill-info" style="margin-left:4px;">${esc(t)}</span>`).join('')}</div>
          </div>
          <div style="background:var(--success-bg); padding:10px; border-radius:6px; text-align:center;">
            <div style="color:var(--success); font-size:12px; font-weight:bold;">إجمالي العهدة المتبقية</div>
            <div style="font-size:18px; font-weight:900; color:var(--success);">${fmt(data.amount)} ج</div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn btn-sm btn-success" style="flex:1;" onclick="openCollectHandoverModal('${esc(name)}')">تحصيل عهدة</button>
            <button class="btn btn-sm btn-warning" style="flex:1;" onclick="convertHandoverToDebt('${esc(name)}')">تحويل لعجز</button>
          </div>
        </div>`;
    }).join('') : '<p class="table-empty">لا يوجد عهد مفتوحة</p>';
  }
  else if (accCollTab === 'debts') {
    contentHTML = Object.keys(debtMap).length ? Object.keys(debtMap).map(name => {
      const data = debtMap[name];
      return `
        <div style="display:flex; flex-direction:column; padding:14px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; gap:10px; border-right:4px solid var(--danger);">
          <div style="display:flex; justify-content:space-between; align-items:start;">
            <h5 style="font-size:15px; font-weight:900; cursor:pointer; color:var(--primary); display:flex; align-items:center; gap:6px;" onclick="viewDebtDetails('${esc(name)}')">
              ${esc(name)} <i class="fas fa-info-circle" style="font-size:14px; color:var(--info);"></i>
            </h5>
            <div style="text-align:left; font-size:11px;">${[...data.types].map(t => `<span class="pill pill-danger" style="margin-left:4px;">${esc(t)}</span>`).join('')}</div>
          </div>
          <div style="background:var(--danger-bg); padding:10px; border-radius:6px; text-align:center;">
            <div style="color:var(--danger); font-size:12px; font-weight:bold;">إجمالي المديونية</div>
            <div style="font-size:18px; font-weight:900; color:var(--danger);">${fmt(data.amount)} ج</div>
          </div>
          <button class="btn btn-sm btn-danger btn-block" onclick="openPayDebtModal('${esc(name)}')">سداد دين</button>
        </div>`;
    }).join('') : '<p class="table-empty">لا يوجد مديونيات</p>';
  }
  else if (accCollTab === 'receivables') {
    contentHTML = Object.keys(receivableMap).length ? Object.keys(receivableMap).map(name => {
      const data = receivableMap[name];

function viewReceivableDetails(name) {
  const w = db.workers.find(x => x.name === name);

  const txns = [];

    if (r.amount > 0) txns.push({ date: r.date, desc: 'مستحق افتتاحي', type: 'credit', amount: r.amount });
  });
  
  db.attendance.filter(a => a.worker === name).forEach(a => {

  db.treasury.filter(t => t.type === 'out' && t.desc === 'سداد مستحقات: ' + name).forEach(t => {
    txns.push({ date: t.date, desc: 'سداد مستحقات', type: 'debit', amount: t.amount });
  });

  txns.sort((a, b) => parseDate(a.date) - parseDate(b.date));

  let tableHTML = `<table style="width:100%; border-collapse:collapse; margin-top:10px; text-align:center; font-size:12px;">

function saveCollectHandover(name, remaining) {
  const cash = num('cCash');
  const eat = num('cEat');
  const ret = num('cReturn');
  const retType = getStr('cReturnType', 'oven');
  const transferStand = getStr('cTransferStand');
  const method = getStr('cMethod', 'cash');

  if (cash === 0 && eat === 0 && ret === 0) return toast('أدخل مبلغ', 'error');
  if (ret > 0 && retType === 'transfer' && !transferStand) return toast('اختر الاستاند', 'error');

  const totalSettled = cash + eat + ret;
  if (totalSettled > remaining + 0.01) return toast('المجموع أكبر من المتبقي', 'error');

  const summary = `
    ${cash > 0 ? `<div>كاش: <strong>${fmt(cash)} ج</strong> (${method === 'cash' ? 'كاش' : 'فودافون'})</div>` : ''}
    ${eat > 0 ? `<div>عيش للأكل: <strong>${fmt(eat)} ج</strong></div>` : ''}
    ${ret > 0 ? `<div>عيش مرتجع: <strong>${fmt(ret)} ج</strong></div>` : ''}
    ${ret > 0 && retType === 'oven' ? `<div>→ يضاف للمتاح للتوزيع</div>` : ''}
    ${ret > 0 && retType === 'waste' ? `<div>→ يسجل هالك</div>` : ''}
    ${ret > 0 && retType === 'transfer' ? `<div>→ تحويل لاستاند: <strong>${esc(transferStand)}</strong></div>` : ''}
    <div style="margin-top:8px;">المتبقي بعد: <strong>${fmt(Math.max(0, remaining - totalSettled))} ج</strong></div>
  `;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      if (cash > 0) {
        db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'in', amount: cash, method, category: 'collection', desc: 'تحصيل من: ' + name });
      }
      if (eat > 0) {
        db.eatingBread.push({ id: uid(), date: db.date, worker: name, amount: eat, recordedBy: currentUser.name });
      }
      if (ret > 0) {
        if (retType === 'waste') {
          db.returns.push({ id: uid(), date: db.date, type: 'هالك', worker: name, amount: ret, recordedBy: currentUser.name });
        } else if (retType === 'oven') {
          db.returns.push({ id: uid(), date: db.date, type: 'مرتجع للفرن', worker: name, amount: ret, recordedBy: currentUser.name });
        } else if (retType === 'transfer' && transferStand) {
          db.transfers.push({ id: uid(), date: db.date, fromStand: name, toStand: transferStand, amount: ret, seen: false });
          let target = db.handovers.find(h => h.date === db.date && h.name === transferStand && h.type === 'استاند');
          if (target) {
            target.amount += ret;
          } else {
            target = { id: uid(), date: db.date, employee: 'غير محدد', type: 'استاند', name: transferStand, amount: ret, paid: 0 };
            db.handovers.push(target);
          }
          db.handoverLines.push({
            id: uid(), handoverId: target.id, date: db.date, type: 'استاند',
            name: transferStand, amount: ret, source: 'transfer',
            desc: `مرتجع من استاند ${name} (عهدة ${name})`, createdAt: db.date
          });
        }
      }
      let toDistribute = totalSettled;
      const targetHandovers = db.handovers.filter(h =>
        h.employee === name && h.paid < h.amount && (h.type === 'استاند' || h.type === 'بيع مباشر')
      ).sort((a, b) => parseDate(a.date) - parseDate(b.date));
      targetHandovers.forEach(h => {
        if (toDistribute <= 0.01) return;
        const hRemaining = h.amount - h.paid;
        const take = Math.min(hRemaining, toDistribute);
        h.paid += take;
        toDistribute -= take;
      });
      logAction('تحصيل عهدة', `${name} - كاش:${cash} عيش:${eat} مرتجع:${ret}`);
      saveDB();
      closeModal();
      toast('تم التحصيل', 'success');
      updateTopbar();
      renderAccCollections();
    }
  });
}

function openPayDebtModal(name) {
  const debts = db.workerLedger.filter(l => l.worker === name && l.status !== 'paid' && (+l.amount || 0) > 0);
  if (debts.length === 0) return toast('لا يوجد ديون', 'info');
  const totalDebt = debts.reduce((a, b) => a + (+b.amount || 0), 0);

  openModal('سداد دين: ' + name,
    `<div class="summary-box" style="margin-bottom:16px;">
       <div class="summary-row total" style="color:var(--danger);"><span>إجمالي الدين:</span><span>${fmt(totalDebt)} ج</span></div>
     </div>
     <div class="form-row">
       <div class="form-group"><label>المبلغ المسدد</label><input type="text" inputmode="numeric" id="pdAmt" class="form-control" oninput="blockInt(this)"></div>
       <div class="form-group"><label>طريقة الدفع</label><select id="pdMethod" class="form-control"><option value="cash">كاش</option><option value="vodafone">فودافون</option></select></div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-success" onclick="savePayDebt('${esc(name)}', ${totalDebt})">تأكيد السداد</button>`
  );
}

function savePayDebt(name, totalDebt) {
  const amt = num('pdAmt');
  const method = getStr('pdMethod', 'cash');
  if (amt <= 0) return toast('أدخل مبلغ', 'error');
  if (amt > totalDebt + 0.01) return toast('المبلغ أكبر من الدين', 'error');

  const summary = `<div>المندوب: <strong>${esc(name)}</strong></div><div>المبلغ: <strong>${fmt(amt)} ج</strong> (${method === 'cash' ? 'كاش' : 'فودافون'})</div>`;

  requireSaveConfirm({
    summary,
    onConfirm: () => {
      db.treasury.push({ id: uid(), date: db.date, employee: currentUser.name, type: 'in', amount: amt, method, category: 'collection', desc: 'سداد دين من: ' + name });
      let toDistribute = amt;
      const debts = db.workerLedger.filter(l => l.worker === name && l.status !== 'paid').sort((a, b) => a.id - b.id);
      debts.forEach(d => {
        if (toDistribute <= 0.01) return;
        const take = Math.min(+d.amount || 0, toDistribute);
        d.amount = (+d.amount || 0) - take;
        toDistribute -= take;
        if (d.amount <= 0.01) d.status = 'paid';
      });
      logAction('سداد دين مندوب', `${name} - ${fmt(amt)}`);
      saveDB(); closeModal(); toast('تم السداد', 'success'); updateTopbar(); renderAccCollections();
    }
  });
}

function convertHandoverToDebt(name) {
  const handovers = db.handovers.filter(h => h.employee === name && h.paid < h.amount && (h.type === 'استاند' || h.type === 'بيع مباشر'));
  if (handovers.length === 0) return toast('لا يوجد عهد', 'info');
  const remaining = handovers.reduce((a, h) => a + (h.amount - h.paid), 0);
  if (remaining <= 0.01) return toast('المتبقي صفر', 'info');

  showConfirm('تحويل عهدة لعجز', `تحويل <b>${fmt(remaining)} ج</b> لـ <b>${esc(name)}</b> كدين؟`, () => {
    db.workerLedger.push({ id: uid(), date: db.date, worker: name, type: 'عجز', amount: remaining, desc: 'تحويل عهدة', status: 'unpaid' });
    handovers.forEach(h => { h.paid = h.amount; });
    logAction('تحويل عهدة لعجز', `${name} - ${fmt(remaining)}`);
    saveDB(); toast('تم التحويل', 'success'); renderAccCollections();
  });
}
